<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TallyMobile — Shivam Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1565c0;
    --primary-dark: #0d47a1;
    --primary-soft: #e8f1fc;
    --ink: #1a2333;
    --ink-soft: #667085;
    --paper: #f4f6f9;
    --paper-line: #e8ebf0;
    --paper-card: #ffffff;
    --forest: #1e8e5a;
    --forest-soft: #e6f7ef;
    --rust: #d32f2f;
    --rust-soft: #fdecea;
    --amber: #f0a020;
    --amber-soft: #fef4e3;
    --border: #e4e7ec;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,40,0.06), 0 1px 3px rgba(16,24,40,0.08);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  h1, h2, h3, .display {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .mono, .amount { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  button { font-family: inherit; cursor: pointer; }

  /* ===== Login Screen ===== */
  #login-screen {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--primary-dark);
    background-image: radial-gradient(circle at 20% 20%, #1976d2 0%, var(--primary-dark) 60%);
  }
  .login-card {
    background: var(--paper-card);
    border-radius: 16px;
    padding: 36px 28px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    text-align: center;
  }
  .login-mark {
    width: 48px; height: 48px;
    margin: 0 auto 18px;
    border-radius: 10px;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    color: var(--paper);
    font-family: 'Inter', sans-serif; font-weight: 800;
    font-weight: 700;
    font-size: 22px;
  }
  .login-card h1 { font-size: 22px; margin: 0 0 4px; color: var(--ink); }
  .login-card p { font-size: 13px; color: var(--ink-soft); margin: 0 0 24px; }
  .login-card input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    font-size: 16px;
    margin-bottom: 12px;
    background: var(--paper);
    color: var(--ink);
  }
  .login-card input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  .login-card button.primary {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    background: var(--primary);
    color: white;
    font-weight: 600;
    font-size: 15px;
    margin-top: 4px;
  }
  .login-error { color: var(--rust); font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* ===== Company Select Screen ===== */
  #company-select-screen {
    display: none;
    min-height: 100dvh;
    background: var(--ink);
    background-image: radial-gradient(circle at 20% 20%, #1976d2 0%, var(--primary-dark) 60%);
    padding: 40px 20px;
  }
  .company-select-inner { max-width: 420px; margin: 0 auto; }
  .company-select-inner h1 { color: var(--paper); font-size: 22px; text-align: center; margin-bottom: 6px; }
  .company-select-inner p { color: #b9c2da; font-size: 13px; text-align: center; margin-bottom: 28px; }
  .company-card {
    background: var(--paper-card);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    display: flex; align-items: center; justify-content: space-between;
    border: none;
    width: 100%;
    text-align: left;
  }
  .company-card .cc-name { font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 700; color: var(--ink); }
  .company-card .cc-arrow { font-size: 18px; color: var(--ink-soft); }

  /* ===== App Shell ===== */
  #app-screen { display: none; }
  header.top {
    position: sticky; top: 0; z-index: 20;
    background: var(--primary);
    color: var(--paper);
    padding: 14px 16px 0;
  }
  .top-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .top-row .brand { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 18px; }
  .top-row .sync-status { font-size: 11px; color: #aab6d1; }
  .top-row .sync-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #7fbf7f; margin-right: 5px; vertical-align: middle;
  }

  .company-switcher {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0 12px;
    border: none; background: none; color: var(--paper);
    width: 100%; text-align: left;
  }
  .company-switcher .cs-name { font-size: 15px; font-weight: 600; }
  .company-switcher .cs-change { font-size: 11.5px; color: #9fb0d6; text-decoration: underline; }

  nav.section-nav {
    display: none; /* replaced by bottom-nav */
  }

  nav.bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex;
    background: var(--paper-card);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
    box-shadow: 0 -2px 8px rgba(16,24,40,0.06);
  }
  .bottom-nav-tab {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 4px 8px;
    border: none;
    background: none;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .bottom-nav-tab .bn-icon { font-size: 19px; line-height: 1; }
  .bottom-nav-tab.active { color: var(--primary); }

  main { padding: 14px 14px 84px; max-width: 720px; margin: 0 auto; }

  /* ===== Dashboard (Home) ===== */
  .dash-greeting { font-size: 13px; color: var(--ink-soft); margin-bottom: 2px; }
  .dash-company-name { font-size: 20px; font-weight: 800; margin-bottom: 16px; }

  .dash-stat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-bottom: 18px;
  }
  .dash-stat-card {
    background: var(--paper-card);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .dash-stat-card .ds-label { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 6px; }
  .dash-stat-card .ds-value { font-size: 19px; font-weight: 800; font-family: 'IBM Plex Mono', monospace; }
  .dash-stat-card.primary { background: var(--primary); }
  .dash-stat-card.primary .ds-label { color: #cfe1f7; }
  .dash-stat-card.primary .ds-value { color: white; }

  .dash-section-title {
    font-size: 13px; font-weight: 700; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.04em;
    margin: 6px 0 10px;
  }

  .dash-tile-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    margin-bottom: 20px;
  }
  .dash-tile {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 6px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    box-shadow: var(--shadow);
  }
  .dash-tile .dt-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
  }
  .dash-tile .dt-label { font-size: 10.5px; font-weight: 600; color: var(--ink); text-align: center; }

  .search-bar {
    display: flex; gap: 8px; margin-bottom: 14px;
  }
  .search-bar input {
    flex: 1;
    padding: 11px 14px;
    border-radius: 9px;
    border: 1.5px solid var(--border);
    background: var(--paper-card);
    font-size: 14px;
    color: var(--ink);
  }
  .search-bar input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  .export-btn {
    padding: 0 14px;
    border-radius: 9px;
    border: 1.5px solid var(--border);
    background: var(--paper-card);
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
  }

  .summary-strip {
    display: flex; gap: 10px; margin-bottom: 16px;
    overflow-x: auto;
  }
  .summary-chip {
    flex: 1; min-width: 130px;
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    box-shadow: var(--shadow);
  }
  .summary-chip .label { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .summary-chip .value { font-size: 18px; font-weight: 600; }
  .summary-chip.rust .value { color: var(--rust); }
  .summary-chip.forest .value { color: var(--forest); }

  .list-card {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 14px;
    border-bottom: 1px solid var(--paper-line);
    gap: 10px;
  }
  .row:last-child { border-bottom: none; }
  .row .name { font-size: 14.5px; font-weight: 500; color: var(--ink); }
  .row .sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .row .amount { font-size: 14.5px; font-weight: 600; white-space: nowrap; }
  .amount.positive { color: var(--forest); }
  .amount.negative { color: var(--rust); }
  .amount.neutral { color: var(--ink-soft); }

  .badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
    background: var(--amber-soft);
    color: var(--amber);
    margin-top: 3px;
  }
  .badge-debtor { background: var(--rust-soft); color: var(--rust); }
  .badge-creditor { background: var(--forest-soft); color: var(--forest); }

  .filter-chips {
    display: flex; gap: 8px; overflow-x: auto;
    margin-bottom: 12px;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .filter-chips::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--paper-card);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .filter-chip.active {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--paper);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty-state .glyph { font-size: 30px; margin-bottom: 10px; }
  .empty-state .title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; color: var(--ink); margin-bottom: 4px; }
  .empty-state .desc { font-size: 13px; }

  .loading-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); font-size: 13px; }

  footer.last-synced {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    padding: 16px 0 4px;
  }

  @media (min-width: 640px) {
    main { padding-top: 20px; }
  }

  /* ===== Overlays (Ledger Detail / Invoice) ===== */
  .overlay {
    display: none;
    position: fixed; inset: 0; z-index: 50;
    background: var(--paper);
    overflow-y: auto;
  }
  .overlay.open { display: block; }
  .overlay-header {
    position: sticky; top: 0; z-index: 5;
    background: var(--primary); color: white;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .overlay-back {
    background: none; border: none; color: var(--paper);
    font-size: 14px; font-weight: 600; padding: 4px 0;
  }
  .overlay-title {
    flex: 1;
    font-family: 'Inter', sans-serif; font-weight: 800;
    font-size: 16px; font-weight: 600;
  }
  .overlay-body { padding: 16px; max-width: 720px; margin: 0 auto 60px; }

  .clickable-row { cursor: pointer; }
  .clickable-row:active { background: var(--paper-line); }

  .invoice-header {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .invoice-header .inv-num { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 18px; }
  .invoice-header .inv-meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }
  .invoice-header .inv-party { font-size: 14px; font-weight: 600; margin-top: 10px; }

  .item-table {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .item-table-head {
    display: flex;
    padding: 9px 12px;
    background: var(--forest-soft);
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--forest);
  }
  .item-row {
    display: flex; align-items: center;
    padding: 11px 12px;
    border-bottom: 1px solid var(--paper-line);
    font-size: 13px;
    gap: 6px;
  }
  .item-row:last-child { border-bottom: none; }
  .item-col-name { flex: 2.2; }
  .item-col-qty, .item-col-rate { flex: 1; text-align: right; }
  .item-col-amt { flex: 1.2; text-align: right; font-weight: 600; }

  .tax-summary {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px 14px;
    box-shadow: var(--shadow);
  }
  .tax-row {
    display: flex; justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--paper-line);
    font-size: 13.5px;
  }
  .tax-row:last-child { border-bottom: none; font-weight: 700; font-size: 15px; padding-top: 12px; }
  .tax-row .amount { font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-mark">S</div>
    <h1>TallyMobile</h1>
    <p>Shivam Hardware &middot; Satyam Traders &middot; Shivam Traders</p>
    <input type="password" id="password-input" placeholder="Enter access code" autocomplete="off">
    <button class="primary" id="login-btn">Unlock</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ===== COMPANY SELECT SCREEN ===== -->
<div id="company-select-screen">
  <div class="company-select-inner">
    <h1>Select Company</h1>
    <p>Choose which business to view</p>
    <div id="company-select-list"></div>
  </div>
</div>

<!-- ===== APP SCREEN ===== -->
<div id="app-screen">
  <header class="top">
    <div class="top-row">
      <div class="brand">TallyMobile</div>
      <div class="sync-status"><span class="sync-dot"></span><span id="sync-text">Loading…</span></div>
    </div>
    <button class="company-switcher" id="company-switcher-btn">
      <span class="cs-name" id="company-switcher-name"></span>
      <span class="cs-change">Switch company</span>
    </button>
  </header>

  <main>
    <div class="search-bar" id="search-bar-row">
      <input type="text" id="search-input" placeholder="Search…">
      <button class="export-btn" id="export-xlsx-btn">XLSX</button>
      <button class="export-btn" id="export-pdf-btn">PDF</button>
    </div>

    <div id="summary-strip" class="summary-strip"></div>

    <div id="content-area">
      <div class="loading-state">Loading data…</div>
    </div>

    <footer class="last-synced" id="last-synced-footer"></footer>
  </main>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="bottom-nav-tab active" data-section="home"><span class="bn-icon">⌂</span>Home</button>
    <button class="bottom-nav-tab" data-section="outstanding"><span class="bn-icon">₹</span>Outstanding</button>
    <button class="bottom-nav-tab" data-section="ledgers"><span class="bn-icon">▤</span>Ledgers</button>
    <button class="bottom-nav-tab" data-section="daybook"><span class="bn-icon">▦</span>Day Book</button>
    <button class="bottom-nav-tab" data-section="stock"><span class="bn-icon">◫</span>Stock</button>
  </nav>

  <!-- Ledger Detail Overlay -->
  <div id="ledger-detail-overlay" class="overlay">
    <div class="overlay-panel">
      <div class="overlay-header">
        <button class="overlay-back" id="ledger-detail-back">&larr; Back</button>
        <div class="overlay-title" id="ledger-detail-title"></div>
      </div>
      <div class="overlay-body" id="ledger-detail-body"></div>
    </div>
  </div>

  <!-- Voucher Detail / Invoice Overlay -->
  <div id="voucher-detail-overlay" class="overlay">
    <div class="overlay-panel">
      <div class="overlay-header">
        <button class="overlay-back" id="voucher-detail-back">&larr; Back</button>
        <div class="overlay-title">Invoice</div>
        <button class="export-btn" id="voucher-export-pdf-btn">Export PDF</button>
      </div>
      <div class="overlay-body" id="voucher-detail-body"></div>
    </div>
  </div>
</div>

<!-- Firebase (modular SDK) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA2h5SVC9gCPmiFq0rqmaZ667RR97dqD7Q",
    authDomain: "tallymobile-cfbed.firebaseapp.com",
    databaseURL: "https://tallymobile-cfbed-default-rtdb.firebaseio.com",
    projectId: "tallymobile-cfbed",
    storageBucket: "tallymobile-cfbed.firebasestorage.app",
    messagingSenderId: "924541599981",
    appId: "1:924541599981:web:6896f5afa95ee98bf3cce4"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const db = getDatabase(firebaseApp);

  // ================= CONFIG =================
  const COMPANIES = [
    { key: "shivam_hardware", label: "Shivam Hardware" },
    { key: "satyam_traders", label: "Satyam Traders" },
    { key: "shivam_traders", label: "Shivam Traders" },
  ];

  // SHA-256 hash of the access code. Default code: "shivam2026"
  // To change: run in any browser console:
  //   crypto.subtle.digest('SHA-256', new TextEncoder().encode('yourcode'))
  //     .then(b => console.log(Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')))
  const ACCESS_CODE_HASH = "dba45ed3a18527c10f48501158da825fa2a6ef833da91b78a6cde9b66da59719";

  const SESSION_KEY = "tallymobile_session";
  const SESSION_HOURS = 24;

  // ================= STATE =================
  let currentCompany = COMPANIES[0].key;
  let appInitialized = false;
  let currentUnsubscribe = null;
  let currentSection = "home";
  let searchTerm = "";
  let companyData = {}; // key -> { ledgers, outstanding_receivables, daybook, stock_items, last_synced }

  // ================= AUTH =================
  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function checkExistingSession() {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return false;
    try {
      const session = JSON.parse(raw);
      const ageHours = (Date.now() - session.ts) / (1000 * 60 * 60);
      return ageHours < SESSION_HOURS;
    } catch { return false; }
  }

  const COMPANY_SELECTION_KEY = "tallymobile_selected_company";

  document.getElementById('login-btn').addEventListener('click', attemptLogin);
  document.getElementById('password-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') attemptLogin();
  });

  async function attemptLogin() {
    const input = document.getElementById('password-input').value;
    const hash = await sha256(input);
    if (hash === ACCESS_CODE_HASH) {
      localStorage.setItem(SESSION_KEY, JSON.stringify({ ts: Date.now() }));
      afterLogin();
    } else {
      document.getElementById('login-error').textContent = "Incorrect access code.";
    }
  }

  function afterLogin() {
    document.getElementById('login-screen').style.display = 'none';
    const savedCompany = localStorage.getItem(COMPANY_SELECTION_KEY);
    if (savedCompany && COMPANIES.some(c => c.key === savedCompany)) {
      currentCompany = savedCompany;
      showApp();
    } else {
      showCompanySelect();
    }
  }

  function showCompanySelect() {
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('company-select-screen').style.display = 'block';
    const list = document.getElementById('company-select-list');
    list.innerHTML = '';
    COMPANIES.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'company-card';
      btn.innerHTML = `<span class="cc-name">${c.label}</span><span class="cc-arrow">&rarr;</span>`;
      btn.addEventListener('click', () => {
        localStorage.setItem(COMPANY_SELECTION_KEY, c.key);
        currentCompany = c.key;
        showApp();
      });
      list.appendChild(btn);
    });
  }

  function showApp() {
    document.getElementById('company-select-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
    document.getElementById('company-switcher-name').textContent =
      COMPANIES.find(c => c.key === currentCompany)?.label || '';
    initApp();
    listenToCurrentCompany(); // always (re)subscribe — handles company switching too

    if (appInitialized) return; // one-time UI wiring only

    attachSectionNav();

    attachExportButtons();

  function attachSectionNav() {
    document.querySelectorAll('.bottom-nav-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.bottom-nav-tab').forEach(b => b.classList.remove('active'));

    document.getElementById('search-input').addEventListener('input', e => {

      render();
    });

  function listenToCurrentCompany() {
    if (currentUnsubscribe) {
      currentUnsubscribe();
      currentUnsubscribe = null;
    }
    document.getElementById('sync-text').textContent = 'Loading…';
    const companyRef = ref(db, `companies/${currentCompany}`);
    currentUnsubscribe = onValue(companyRef, snapshot => {
      companyData[currentCompany] = snapshot.val() || {};
      document.getElementById('sync-text').textContent = 'Live';
      render();
    }, error => {
      document.getElementById('sync-text').textContent = 'Connection error';
      console.error(error);
    });

    const contentArea = document.getElementById('content-area');
    const summaryStrip = document.getElementById('summary-strip');
    const footer = document.getElementById('last-synced-footer');
    const searchBarRow = document.getElementById('search-bar-row');

    if (!data) {
      contentArea.innerHTML = '<div class="loading-state">Loading data…</div>';
      summaryStrip.innerHTML = '';
      footer.textContent = '';
      return;
    }

    footer.textContent = data.last_synced ? `Last synced: ${formatDateTime(data.last_synced)}` : '';

    searchBarRow.style.display = currentSection === 'home' ? 'none' : 'flex';

    if (currentSection === 'home') renderHome(data, contentArea, summaryStrip);
    else if (currentSection === 'outstanding') renderOutstanding(data, contentArea, summaryStrip);
    else if (currentSection === 'ledgers') renderLedgers(data, contentArea, summaryStrip);
    else if (currentSection === 'daybook') renderDaybook(data, contentArea, summaryStrip);
    else if (currentSection === 'stock') renderStock(data, contentArea, summaryStrip);
  }

  // ---- Invoice PDF helpers ----

  function extractGstRate(ledgerName) {
    if (!ledgerName) return null;
    const m = ledgerName.match(/(\d+(\.\d+)?)\s*%/);
    return m ? parseFloat(m[1]) : null;
  }

  function parseQtyUnit(qtyStr) {
    if (!qtyStr) return { qty: '', unit: '' };
    const m = String(qtyStr).trim().match(/^([\d.,\-]+)\s*(.*)$/);
    if (!m) return { qty: qtyStr.trim(), unit: '' };
    return { qty: m[1], unit: m[2] || '' };
  }

  function parseRatePer(rateStr) {
    if (!rateStr) return { rate: '', per: '' };
    const parts = String(rateStr).trim().split('/');
    return { rate: parts[0] || '', per: parts[1] || '' };
  }

  const NUM_ONES = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
    'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const NUM_TENS = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];

  function twoDigitWords(n) {
    if (n < 20) return NUM_ONES[n];
    return NUM_TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + NUM_ONES[n % 10] : '');
  }

  function threeDigitWords(n) {
    let str = '';
    if (n >= 100) {
      str += NUM_ONES[Math.floor(n / 100)] + ' Hundred';
      n = n % 100;
      if (n) str += ' ';
    }
    if (n > 0) str += twoDigitWords(n);
    return str;
  }

  function numberToWordsIndian(num) {
    num = Math.floor(num);
    if (num === 0) return 'Zero';
    let result = '';
    const crore = Math.floor(num / 10000000); num %= 10000000;
    const lakh = Math.floor(num / 100000); num %= 100000;
    const thousand = Math.floor(num / 1000); num %= 1000;
    const hundred = num;
    if (crore) result += threeDigitWords(crore) + ' Crore ';
    if (lakh) result += twoDigitWords(lakh) + ' Lakh ';
    if (thousand) result += twoDigitWords(thousand) + ' Thousand ';
    if (hundred) result += threeDigitWords(hundred);
    return result.trim();
  }

  function amountInWords(amount, unitLabel) {
    const whole = Math.floor(Math.abs(amount));
    const fraction = Math.round((Math.abs(amount) - whole) * 100);
    let words = 'Indian Rupees ' + numberToWordsIndian(whole);
    if (fraction > 0) {
      words += ' and ' + numberToWordsIndian(fraction) + ' Paise';
    }
    words += ' Only';
    return words;
  }

  // Draws a bordered cell with text. align: 'left' | 'center' | 'right'
  function pdfCell(doc, x, y, w, h, text, opts = {}) {
    const { align = 'left', bold = false, fontSize = 8, border = true, padX = 1.5 } = opts;
    if (border) doc.rect(x, y, w, h);
    if (text === undefined || text === null || text === '') return;
    doc.setFontSize(fontSize);
    doc.setFont(undefined, bold ? 'bold' : 'normal');
    let tx = x + padX;
    if (align === 'right') tx = x + w - padX;
    else if (align === 'center') tx = x + w / 2;
    const ty = y + h / 2 + fontSize * 0.13;
    doc.text(String(text), tx, ty, { align, maxWidth: w - padX * 2 });
  }

  async function exportInvoicePDF() {
    if (!currentVoucherDetail) { alert('No invoice loaded to export.'); return; }
    if (!window.jspdf) {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const v = currentVoucherDetail;
    const companyLabel = COMPANIES.find(c => c.key === currentCompany)?.label || currentCompany;
    const data = companyData[currentCompany] || {};
    const companyInfo = data.company_info || {};
    const buyerLedger = (data.party_details || {})[v.party] || safeArray(Object.values(data.party_details || {})).find(p => p.name === v.party) || {};
    const stockItems = safeArray(data.stock_items);

    const pageWidth = 210;
    const marginX = 10;
    const contentWidth = pageWidth - marginX * 2; // 190mm

    let y = 10;

    doc.setFontSize(13);
    doc.setFont(undefined, 'bold');
    doc.text('Tax Invoice', pageWidth / 2, y + 5, { align: 'center' });
    y += 10;

    // ---- Header: Company (left) + Invoice No/Date (right) ----
    const headerH = 34;
    const leftW = contentWidth * 0.62;
    const rightW = contentWidth - leftW;

    doc.rect(marginX, y, leftW, headerH);
    doc.rect(marginX + leftW, y, rightW, headerH);

    let ly = y + 5;
    doc.setFontSize(10.5);
    doc.setFont(undefined, 'bold');
    doc.text(companyLabel.toUpperCase(), marginX + 2, ly);
    ly += 4.5;
    doc.setFontSize(8.5);
    doc.setFont(undefined, 'normal');
    if (companyInfo.address) {
      const addrLines = companyInfo.address.split(/[\n,]+/).map(l => l.trim()).filter(Boolean);
      // Pack address onto fewer lines, comma-joined, to match Tally's compact style
      doc.text(addrLines.join(', '), marginX + 2, ly, { maxWidth: leftW - 4 });
      ly += 4 * Math.max(1, Math.ceil(doc.getTextWidth(addrLines.join(', ')) / (leftW - 4)));
    }
    if (companyInfo.gstin) {
      doc.text(`GSTIN/UIN: ${companyInfo.gstin}`, marginX + 2, ly);
      ly += 4;
    }
    if (companyInfo.state) {
      doc.text(`State Name: ${companyInfo.state}`, marginX + 2, ly);
      ly += 4;
    }
    if (companyInfo.email) {
      doc.text(`E-Mail: ${companyInfo.email}`, marginX + 2, ly);
      ly += 4;
    }

    // Right box: Invoice No / Date
    const rx = marginX + leftW;
    doc.setFontSize(8);
    doc.text('Invoice No.', rx + 2, y + 5);
    doc.text('Dated', rx + rightW * 0.55, y + 5);
    doc.setFont(undefined, 'bold');
    doc.setFontSize(9.5);
    doc.text(String(v.voucher_number || '-'), rx + 2, y + 10);
    doc.text(formatTallyDate(v.date), rx + rightW * 0.55, y + 10);
    doc.setFont(undefined, 'normal');
    doc.line(rx, y + 13, rx + rightW, y + 13);
    doc.setFontSize(8);
    doc.text('Mode/Terms of Payment', rx + 2, y + 18);
    doc.line(rx, y + headerH - 8, rx + rightW, y + headerH - 8);
    doc.text('Terms of Delivery', rx + 2, y + headerH - 4);

    y += headerH;

    // ---- Buyer box ----
    const buyerH = 26;
    doc.rect(marginX, y, contentWidth, buyerH);
    let by = y + 4.5;
    doc.setFontSize(8);
    doc.text('Buyer (Bill to)', marginX + 2, by);
    by += 4.5;
    doc.setFontSize(9.5);
    doc.setFont(undefined, 'bold');
    doc.text(String(v.party || '-'), marginX + 2, by);
    doc.setFont(undefined, 'normal');
    by += 4;
    doc.setFontSize(8.5);
    if (buyerLedger.address) {
      const addrLines = buyerLedger.address.split(/[\n,]+/).map(l => l.trim()).filter(Boolean);
      doc.text(addrLines.join(', '), marginX + 2, by, { maxWidth: contentWidth - 4 });
      by += 4;
    }
    if (buyerLedger.gstin) {
      doc.text(`GSTIN/UIN: ${buyerLedger.gstin}`, marginX + 2, by);
      by += 4;
    }
    if (buyerLedger.state) {
      doc.text(`State Name: ${buyerLedger.state}`, marginX + 2, by);
      by += 4;
      doc.text(`Place of Supply: ${buyerLedger.state}`, marginX + 2, by);
    }

    y += buyerH;

    // ---- Item table ----
    const items = safeArray(v.items);
    const ledgerLines = safeArray(v.ledger_lines);

    const cols = [
      { key: 'sl', label: 'Sl\nNo.', w: 8, align: 'center' },
      { key: 'desc', label: 'Description of Goods', w: 52, align: 'left' },
      { key: 'hsn', label: 'HSN/SAC', w: 18, align: 'center' },
      { key: 'gst', label: 'GST\nRate', w: 12, align: 'center' },
      { key: 'qty', label: 'Quantity', w: 22, align: 'right' },
      { key: 'rate', label: 'Rate', w: 20, align: 'right' },
      { key: 'per', label: 'per', w: 12, align: 'center' },
      { key: 'disc', label: 'Disc %', w: 12, align: 'center' },
      { key: 'amount', label: 'Amount', w: contentWidth - (8+52+18+12+22+20+12+12), align: 'right' },
    ];

    const rowH = 6;
    const headH = 9;

    function drawTableHeader() {
      let cx = marginX;
      cols.forEach(c => {
        pdfCell(doc, cx, y, c.w, headH, c.label, { align: 'center', bold: true, fontSize: 7.5 });
        cx += c.w;
      });
      y += headH;
    }

    drawTableHeader();

    // Look up HSN per item from the already-synced stock item list
    function hsnFor(itemName) {
      const match = stockItems.find(s => s.name === itemName);
      return match && match.hsn_code ? match.hsn_code : '';
    }

    items.forEach((item, idx) => {
      if (y + rowH > 280) {
        doc.addPage();
        y = 15;
        drawTableHeader();
      }
      const { qty, unit } = parseQtyUnit(item.billed_qty);
      const { rate, per } = parseRatePer(item.rate);
      const gstRate = extractGstRate(item.sales_ledger_name);
      const discount = parseAmt(item.discount);

      let cx = marginX;
      const rowVals = {
        sl: String(idx + 1),
        desc: item.item_name || '-',
        hsn: hsnFor(item.item_name) || '',
        gst: gstRate ? `${gstRate}%` : '',
        qty: `${qty} ${unit}`.trim(),
        rate: rate.trim(),
        per: per.trim(),
        disc: discount ? `${discount}%` : '',
        amount: formatCurrencyPDF(parseAmt(item.amount)),
      };
      cols.forEach(c => {
        pdfCell(doc, cx, y, c.w, rowH, rowVals[c.key], { align: c.align, fontSize: 7.5 });
        cx += c.w;
      });
      y += rowH;
    });

    // Tax/total rows — spans description+ area, amount in last column
    const descAndBeforeW = cols.slice(0, cols.length - 1).reduce((s, c) => s + c.w, 0);
    const amountColX = marginX + descAndBeforeW;
    const amountColW = cols[cols.length - 1].w;

    let grandTotal = parseAmt(v.amount);

    ledgerLines.filter(l => l.ledger_name !== v.party).forEach(line => {
      if (y + rowH > 280) { doc.addPage(); y = 15; }
      doc.rect(marginX, y, descAndBeforeW, rowH);
      doc.setFont(undefined, 'italic');
      doc.setFontSize(8);
      doc.text(line.ledger_name || '-', marginX + descAndBeforeW - 2, y + rowH / 2 + 1, { align: 'right' });
      doc.setFont(undefined, 'normal');
      pdfCell(doc, amountColX, y, amountColW, rowH, formatCurrencyPDF(Math.abs(parseAmt(line.amount))), { align: 'right', fontSize: 7.5 });
      y += rowH;
    });

    // Total row
    if (y + rowH > 280) { doc.addPage(); y = 15; }
    pdfCell(doc, marginX, y, descAndBeforeW, rowH, 'Total', { align: 'right', bold: true, fontSize: 8.5 });
    pdfCell(doc, amountColX, y, amountColW, rowH, formatCurrencyPDF(Math.abs(grandTotal)), { align: 'right', bold: true, fontSize: 8.5 });
    y += rowH;

    // Amount in words row
    const wordsH = 10;
    doc.rect(marginX, y, contentWidth, wordsH);
    doc.setFontSize(7.5);
    doc.setFont(undefined, 'italic');
    doc.text('Amount Chargeable (in words)', marginX + 2, y + 4);
    doc.setFont(undefined, 'normal');
    doc.setFontSize(8.5);
    doc.text(amountInWords(grandTotal), marginX + 2, y + 8, { maxWidth: contentWidth - 4 });
    y += wordsH;

    // ---- HSN-wise tax summary table ----
    const hsnGroups = {};
    items.forEach(item => {
      const hsn = hsnFor(item.item_name) || 'N/A';
      const gstRate = extractGstRate(item.sales_ledger_name) || 0;
      const key = `${hsn}|${gstRate}`;
      if (!hsnGroups[key]) hsnGroups[key] = { hsn, gstRate, taxable: 0 };
      hsnGroups[key].taxable += Math.abs(parseAmt(item.amount));
    });
    const hasIGST = ledgerLines.some(l => (l.ledger_name || '').toUpperCase().includes('IGST'));

    if (y + 10 > 280) { doc.addPage(); y = 15; }

    const hsnCols = hasIGST
      ? [
          { key: 'hsn', label: 'HSN/SAC', w: 30 },
          { key: 'taxable', label: 'Taxable\nValue', w: 32 },
          { key: 'igstRate', label: 'IGST Rate', w: 26 },
          { key: 'igstAmt', label: 'IGST Amount', w: 32 },
          { key: 'total', label: 'Total Tax Amount', w: contentWidth - (30+32+26+32) },
        ]
      : [
          { key: 'hsn', label: 'HSN/SAC', w: 26 },
          { key: 'taxable', label: 'Taxable\nValue', w: 28 },
          { key: 'cgstRate', label: 'CGST Rate', w: 20 },
          { key: 'cgstAmt', label: 'CGST Amount', w: 26 },
          { key: 'sgstRate', label: 'SGST Rate', w: 20 },
          { key: 'sgstAmt', label: 'SGST Amount', w: 26 },
          { key: 'total', label: 'Total Tax Amount', w: contentWidth - (26+28+20+26+20+26) },
        ];

    let hx = marginX;
    hsnCols.forEach(c => {
      pdfCell(doc, hx, y, c.w, 9, c.label, { align: 'center', bold: true, fontSize: 7 });
      hx += c.w;
    });
    y += 9;

    let hsnTotalTaxable = 0, hsnTotalTax = 0;
    Object.values(hsnGroups).forEach(g => {
      if (y + rowH > 280) { doc.addPage(); y = 15; }
      const halfRate = g.gstRate / 2;
      const cgstAmt = g.taxable * halfRate / 100;
      const sgstAmt = g.taxable * halfRate / 100;
      const igstAmt = g.taxable * g.gstRate / 100;
      const totalTax = hasIGST ? igstAmt : (cgstAmt + sgstAmt);
      hsnTotalTaxable += g.taxable;
      hsnTotalTax += totalTax;

      hx = marginX;
      const rowVals = hasIGST
        ? { hsn: g.hsn, taxable: formatCurrencyPDF(g.taxable), igstRate: `${g.gstRate}%`, igstAmt: formatCurrencyPDF(igstAmt), total: formatCurrencyPDF(totalTax) }
        : { hsn: g.hsn, taxable: formatCurrencyPDF(g.taxable), cgstRate: `${halfRate}%`, cgstAmt: formatCurrencyPDF(cgstAmt), sgstRate: `${halfRate}%`, sgstAmt: formatCurrencyPDF(sgstAmt), total: formatCurrencyPDF(totalTax) };
      hsnCols.forEach(c => {
        pdfCell(doc, hx, y, c.w, rowH, rowVals[c.key], { align: c.key === 'hsn' ? 'center' : 'right', fontSize: 7.5 });
        hx += c.w;
      });
      y += rowH;
    });

    // HSN table total row
    hx = marginX;
    const hsnTotalVals = hasIGST
      ? { hsn: 'Total', taxable: formatCurrencyPDF(hsnTotalTaxable), igstRate: '', igstAmt: '', total: formatCurrencyPDF(hsnTotalTax) }
      : { hsn: 'Total', taxable: formatCurrencyPDF(hsnTotalTaxable), cgstRate: '', cgstAmt: '', sgstRate: '', sgstAmt: '', total: formatCurrencyPDF(hsnTotalTax) };
    hsnCols.forEach(c => {
      pdfCell(doc, hx, y, c.w, rowH, hsnTotalVals[c.key], { align: c.key === 'hsn' ? 'center' : 'right', bold: true, fontSize: 7.5 });
      hx += c.w;
    });
    y += rowH + 4;

    // Tax amount in words
    if (y + 8 > 280) { doc.addPage(); y = 15; }
    doc.setFontSize(7.5);
    doc.setFont(undefined, 'italic');
    doc.text('Tax Amount (in words):', marginX, y);
    doc.setFont(undefined, 'normal');
    doc.setFontSize(8.5);
    doc.text(amountInWords(hsnTotalTax), marginX + 32, y, { maxWidth: contentWidth - 34 });
    y += 10;

    // ---- Declaration (left) + Bank Details (right) ----
    if (y + 40 > 280) { doc.addPage(); y = 15; }
    const boxH = 34;
    const declW = contentWidth * 0.5;
    const bankW = contentWidth - declW;
    doc.rect(marginX, y, declW, boxH);
    doc.rect(marginX + declW, y, bankW, boxH);

    let dy = y + 4;
    doc.setFontSize(7.5);
    doc.setFont(undefined, 'bold');
    doc.text('Declaration', marginX + 2, dy);
    doc.setFont(undefined, 'normal');
    dy += 4;
    const declText = 'We declare that this invoice shows the actual price of the goods described and that all particulars are true and correct.';
    doc.text(declText, marginX + 2, dy, { maxWidth: declW - 4 });

    let ky = y + 4;
    doc.setFont(undefined, 'bold');
    doc.text("Company's Bank Details", marginX + declW + 2, ky);
    doc.setFont(undefined, 'normal');
    ky += 5;
    if (companyInfo.bank_name) {
      doc.text(`Bank Name: ${companyInfo.bank_name}`, marginX + declW + 2, ky);
      ky += 4.5;
    }
    if (companyInfo.bank_account) {
      doc.text(`A/c No.: ${companyInfo.bank_account}`, marginX + declW + 2, ky);
      ky += 4.5;
    }
    if (companyInfo.bank_ifsc) {
      doc.text(`IFSC Code: ${companyInfo.bank_ifsc}`, marginX + declW + 2, ky);
      ky += 4.5;
    }
    doc.setFontSize(8);
    doc.text(`for ${companyLabel}`, marginX + declW + bankW - 2, y + boxH - 10, { align: 'right' });
    doc.setFontSize(7.5);
    doc.text('Authorised Signatory', marginX + declW + bankW - 2, y + boxH - 3, { align: 'right' });

    y += boxH + 6;

    doc.setFontSize(7.5);
    doc.setFont(undefined, 'italic');
    doc.text('This is a Computer Generated Invoice', pageWidth / 2, y, { align: 'center' });

    doc.save(`invoice_${v.voucher_number || 'export'}.pdf`);
  }

  // ================= HELPERS =================
  // Firebase drops array entries entirely when every field in them is
  // null/blank, which leaves a genuine 'hole' (undefined) at that index
  // when the array comes back — .filter(Boolean) strips those out so
  // .find()/.map()/etc never trip on an undefined element.
  function safeArray(x) {
    return (x || []).filter(Boolean);
  }

  function parseAmt(v) {
    if (v === null || v === undefined || v === '') return 0;
    const n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }

  function formatCurrency(n) {
    const abs = Math.abs(n);
    const formatted = abs.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (n < 0 ? '−' : '') + '₹' + formatted;
  }

  // jsPDF's default font (Helvetica) can't render the ₹ symbol — it shows
  // as a broken glyph. Use this instead of formatCurrency() inside any
  // doc.text() call.
  function formatCurrencyPDF(n) {
    const abs = Math.abs(n);
    const formatted = abs.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (n < 0 ? '-' : '') + 'Rs. ' + formatted;
  }

  function formatTallyDate(d) {
    if (!d) return '';
    // Tally dates often come as YYYYMMDD
    if (/^\d{8}$/.test(d)) {
      return `${d.slice(6,8)}-${d.slice(4,6)}-${d.slice(0,4)}`;
    }
    return d;
  }

  function formatDateTime(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    } catch { return iso; }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function getCurrentRows() {
    const data = companyData[currentCompany] || {};
    let key = { outstanding: 'outstanding_receivables', ledgers: 'ledgers', daybook: 'daybook', stock: 'stock_items' }[currentSection];
    let rows = safeArray(data[key]);
    if (searchTerm) {
      rows = rows.filter(r => JSON.stringify(r).toLowerCase().includes(searchTerm));
    }
    return rows;
  }

  // ================= EXPORT =================
  function attachExportButtons() {
    document.getElementById('export-xlsx-btn').addEventListener('click', exportXLSX);
    document.getElementById('export-pdf-btn').addEventListener('click', exportPDF);
  }

  async function exportXLSX() {
    const rows = getCurrentRows();
    if (rows.length === 0) { alert('No data to export.'); return; }
    if (!window.XLSX) {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    }
    const ws = window.XLSX.utils.json_to_sheet(rows);
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, currentSection);
    window.XLSX.writeFile(wb, `${currentCompany}_${currentSection}.xlsx`);
  }

  async function exportPDF() {
    const rows = getCurrentRows();
    if (rows.length === 0) { alert('No data to export.'); return; }
    if (!window.jspdf) {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const companyLabel = COMPANIES.find(c => c.key === currentCompany)?.label || currentCompany;
    doc.setFontSize(14);
    doc.text(`${companyLabel} — ${currentSection}`, 14, 16);
    doc.setFontSize(9);
    let y = 26;
    const cols = Object.keys(rows[0]);
    doc.text(cols.join(' | '), 14, y);
    y += 6;
    rows.forEach(r => {
      if (y > 280) { doc.addPage(); y = 16; }
      const line = cols.map(c => String(r[c] ?? '')).join(' | ');
      doc.text(line.slice(0, 120), 14, y);
      y += 5.5;
    });
    doc.save(`${currentCompany}_${currentSection}.pdf`);
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }
</script>
</body>
</html>
