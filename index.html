<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TallyMobile — Shivam Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1565c0;
    --primary-dark: #0d47a1;
    --primary-soft: #e8f1fc;
    --ink: #1a2333;
    --ink-soft: #667085;
    --paper: #f4f6f9;
    --paper-line: #e8ebf0;
    --paper-card: #ffffff;
    --forest: #1e8e5a;
    --forest-soft: #e6f7ef;
    --rust: #d32f2f;
    --rust-soft: #fdecea;
    --amber: #f0a020;
    --amber-soft: #fef4e3;
    --border: #e4e7ec;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,40,0.06), 0 1px 3px rgba(16,24,40,0.08);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  h1, h2, h3, .display {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .mono, .amount { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }

  button { font-family: inherit; cursor: pointer; }

  /* ===== Login Screen ===== */
  #login-screen {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--primary-dark);
    background-image: radial-gradient(circle at 20% 20%, #1976d2 0%, var(--primary-dark) 60%);
  }
  .login-card {
    background: var(--paper-card);
    border-radius: 16px;
    padding: 36px 28px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    text-align: center;
  }
  .login-mark {
    width: 48px; height: 48px;
    margin: 0 auto 18px;
    border-radius: 10px;
    background: var(--primary);
    display: flex; align-items: center; justify-content: center;
    color: var(--paper);
    font-family: 'Inter', sans-serif; font-weight: 800;
    font-weight: 700;
    font-size: 22px;
  }
  .login-card h1 { font-size: 22px; margin: 0 0 4px; color: var(--ink); }
  .login-card p { font-size: 13px; color: var(--ink-soft); margin: 0 0 24px; }
  .login-card input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    font-size: 16px;
    margin-bottom: 12px;
    background: var(--paper);
    color: var(--ink);
  }
  .login-card input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  .login-card button.primary {
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    background: var(--primary);
    color: white;
    font-weight: 600;
    font-size: 15px;
    margin-top: 4px;
  }
  .login-error { color: var(--rust); font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* ===== Company Select Screen ===== */
  #company-select-screen {
    display: none;
    min-height: 100dvh;
    background: var(--ink);
    background-image: radial-gradient(circle at 20% 20%, #1976d2 0%, var(--primary-dark) 60%);
    padding: 40px 20px;
  }
  .company-select-inner { max-width: 420px; margin: 0 auto; }
  .company-select-inner h1 { color: var(--paper); font-size: 22px; text-align: center; margin-bottom: 6px; }
  .company-select-inner p { color: #b9c2da; font-size: 13px; text-align: center; margin-bottom: 28px; }
  .company-card {
    background: var(--paper-card);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    display: flex; align-items: center; justify-content: space-between;
    border: none;
    width: 100%;
    text-align: left;
  }
  .company-card .cc-name { font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 700; color: var(--ink); }
  .company-card .cc-arrow { font-size: 18px; color: var(--ink-soft); }

  /* ===== App Shell ===== */
  #app-screen { display: none; }
  header.top {
    position: sticky; top: 0; z-index: 20;
    background: var(--primary);
    color: var(--paper);
    padding: 14px 16px 0;
  }
  .top-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .top-row .brand { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 18px; }
  .top-row .sync-status { font-size: 11px; color: #aab6d1; }
  .top-row .sync-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #7fbf7f; margin-right: 5px; vertical-align: middle;
  }

  .company-switcher {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0 12px;
    border: none; background: none; color: var(--paper);
    width: 100%; text-align: left;
  }
  .company-switcher .cs-name { font-size: 15px; font-weight: 600; }
  .company-switcher .cs-change { font-size: 11.5px; color: #9fb0d6; text-decoration: underline; }

  nav.section-nav {
    display: none; /* replaced by bottom-nav */
  }

  nav.bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
    display: flex;
    background: var(--paper-card);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
    box-shadow: 0 -2px 8px rgba(16,24,40,0.06);
  }
  .bottom-nav-tab {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 9px 4px 8px;
    border: none;
    background: none;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .bottom-nav-tab .bn-icon { font-size: 19px; line-height: 1; }
  .bottom-nav-tab.active { color: var(--primary); }

  main { padding: 14px 14px 84px; max-width: 720px; margin: 0 auto; }

  /* ===== Dashboard (Home) ===== */
  .dash-greeting { font-size: 13px; color: var(--ink-soft); margin-bottom: 2px; }
  .dash-company-name { font-size: 20px; font-weight: 800; margin-bottom: 16px; }

  .dash-stat-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    margin-bottom: 18px;
  }
  .dash-stat-card {
    background: var(--paper-card);
    border-radius: var(--radius);
    padding: 14px 16px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .dash-stat-card .ds-label { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 6px; }
  .dash-stat-card .ds-value { font-size: 19px; font-weight: 800; font-family: 'IBM Plex Mono', monospace; }
  .dash-stat-card.primary { background: var(--primary); }
  .dash-stat-card.primary .ds-label { color: #cfe1f7; }
  .dash-stat-card.primary .ds-value { color: white; }

  .dash-section-title {
    font-size: 13px; font-weight: 700; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.04em;
    margin: 6px 0 10px;
  }

  .dash-tile-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    margin-bottom: 20px;
  }
  .dash-tile {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 6px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    box-shadow: var(--shadow);
  }
  .dash-tile .dt-icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 19px;
  }
  .dash-tile .dt-label { font-size: 10.5px; font-weight: 600; color: var(--ink); text-align: center; }

  .search-bar {
    display: flex; gap: 8px; margin-bottom: 14px;
  }
  .search-bar input {
    flex: 1;
    padding: 11px 14px;
    border-radius: 9px;
    border: 1.5px solid var(--border);
    background: var(--paper-card);
    font-size: 14px;
    color: var(--ink);
  }
  .search-bar input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
  .export-btn {
    padding: 0 14px;
    border-radius: 9px;
    border: 1.5px solid var(--border);
    background: var(--paper-card);
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
  }

  .summary-strip {
    display: flex; gap: 10px; margin-bottom: 16px;
    overflow-x: auto;
  }
  .summary-chip {
    flex: 1; min-width: 130px;
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    box-shadow: var(--shadow);
  }
  .summary-chip .label { font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .summary-chip .value { font-size: 18px; font-weight: 600; }
  .summary-chip.rust .value { color: var(--rust); }
  .summary-chip.forest .value { color: var(--forest); }

  .list-card {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 14px;
    border-bottom: 1px solid var(--paper-line);
    gap: 10px;
  }
  .row:last-child { border-bottom: none; }
  .row .name { font-size: 14.5px; font-weight: 500; color: var(--ink); }
  .row .sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .row .amount { font-size: 14.5px; font-weight: 600; white-space: nowrap; }
  .amount.positive { color: var(--forest); }
  .amount.negative { color: var(--rust); }
  .amount.neutral { color: var(--ink-soft); }

  .badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 20px;
    background: var(--amber-soft);
    color: var(--amber);
    margin-top: 3px;
  }
  .badge-debtor { background: var(--rust-soft); color: var(--rust); }
  .badge-creditor { background: var(--forest-soft); color: var(--forest); }

  .filter-chips {
    display: flex; gap: 8px; overflow-x: auto;
    margin-bottom: 12px;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .filter-chips::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--paper-card);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .filter-chip.active {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--paper);
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty-state .glyph { font-size: 30px; margin-bottom: 10px; }
  .empty-state .title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; color: var(--ink); margin-bottom: 4px; }
  .empty-state .desc { font-size: 13px; }

  .loading-state { text-align: center; padding: 60px 20px; color: var(--ink-soft); font-size: 13px; }

  footer.last-synced {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    padding: 16px 0 4px;
  }

  @media (min-width: 640px) {
    main { padding-top: 20px; }
  }

  /* ===== Overlays (Ledger Detail / Invoice) ===== */
  .overlay {
    display: none;
    position: fixed; inset: 0; z-index: 50;
    background: var(--paper);
    overflow-y: auto;
  }
  .overlay.open { display: block; }
  .overlay-header {
    position: sticky; top: 0; z-index: 5;
    background: var(--primary); color: white;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .overlay-back {
    background: none; border: none; color: var(--paper);
    font-size: 14px; font-weight: 600; padding: 4px 0;
  }
  .overlay-title {
    flex: 1;
    font-family: 'Inter', sans-serif; font-weight: 800;
    font-size: 16px; font-weight: 600;
  }
  .overlay-body { padding: 16px; max-width: 720px; margin: 0 auto 60px; }

  .date-range-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    background: var(--paper-card);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 4;
  }
  .date-range-bar input[type="date"] {
    flex: 1;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    font-size: 13px;
    color: var(--ink);
    background: var(--paper);
    min-width: 0;
  }
  .date-range-sep { font-size: 12px; color: var(--ink-soft); flex-shrink: 0; }
  .date-range-reset {
    flex-shrink: 0;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--paper);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .clickable-row { cursor: pointer; }
  .clickable-row:active { background: var(--paper-line); }

  .invoice-header {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .invoice-header .inv-num { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 18px; }
  .invoice-header .inv-meta { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }
  .invoice-header .inv-party { font-size: 14px; font-weight: 600; margin-top: 10px; }

  .item-table {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 14px;
  }
  .item-table-head {
    display: flex;
    padding: 9px 12px;
    background: var(--forest-soft);
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
    color: var(--forest);
  }
  .item-row {
    display: flex; align-items: center;
    padding: 11px 12px;
    border-bottom: 1px solid var(--paper-line);
    font-size: 13px;
    gap: 6px;
  }
  .item-row:last-child { border-bottom: none; }
  .item-col-name { flex: 2.2; }
  .item-col-qty, .item-col-rate { flex: 1; text-align: right; }
  .item-col-amt { flex: 1.2; text-align: right; font-weight: 600; }

  .tax-summary {
    background: var(--paper-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px 14px;
    box-shadow: var(--shadow);
  }
  .tax-row {
    display: flex; justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--paper-line);
    font-size: 13.5px;
  }
  .tax-row:last-child { border-bottom: none; font-weight: 700; font-size: 15px; padding-top: 12px; }
  .tax-row .amount { font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-mark">S</div>
    <h1>TallyMobile</h1>
    <p>Shivam Hardware &middot; Satyam Traders &middot; Shivam Traders</p>
    <input type="password" id="password-input" placeholder="Enter access code" autocomplete="off">
    <button class="primary" id="login-btn">Unlock</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ===== COMPANY SELECT SCREEN ===== -->
<div id="company-select-screen">
  <div class="company-select-inner">
    <h1>Select Company</h1>
    <p>Choose which business to view</p>
    <div id="company-select-list"></div>
  </div>
</div>

<!-- ===== APP SCREEN ===== -->
<div id="app-screen">
  <header class="top">
    <div class="top-row">
      <div class="brand">TallyMobile</div>
      <div class="sync-status"><span class="sync-dot"></span><span id="sync-text">Loading…</span></div>
    </div>
    <button class="company-switcher" id="company-switcher-btn">
      <span class="cs-name" id="company-switcher-name"></span>
      <span class="cs-change">Switch company</span>
    </button>
  </header>

  <main>
    <div class="search-bar" id="search-bar-row">
      <input type="text" id="search-input" placeholder="Search…">
      <button class="export-btn" id="export-xlsx-btn">XLSX</button>
      <button class="export-btn" id="export-pdf-btn">PDF</button>
    </div>

    <div id="summary-strip" class="summary-strip"></div>

    <div id="content-area">
      <div class="loading-state">Loading data…</div>
    </div>

    <footer class="last-synced" id="last-synced-footer"></footer>
  </main>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="bottom-nav-tab active" data-section="home"><span class="bn-icon">⌂</span>Home</button>
    <button class="bottom-nav-tab" data-section="outstanding"><span class="bn-icon">₹</span>Outstanding</button>
    <button class="bottom-nav-tab" data-section="ledgers"><span class="bn-icon">▤</span>Ledgers</button>
    <button class="bottom-nav-tab" data-section="daybook"><span class="bn-icon">▦</span>Day Book</button>
    <button class="bottom-nav-tab" data-section="stock"><span class="bn-icon">◫</span>Stock</button>
  </nav>

  <!-- Ledger Detail Overlay -->
  <!-- P&L / Balance Sheet Group Detail Overlay -->
  <div id="group-detail-overlay" class="overlay">
    <div class="overlay-panel">
      <div class="overlay-header">
        <button class="overlay-back" id="group-detail-back">&larr; Back</button>
        <div class="overlay-title" id="group-detail-title"></div>
      </div>
      <div class="overlay-body" id="group-detail-body"></div>
    </div>
  </div>

  <div id="ledger-detail-overlay" class="overlay">
    <div class="overlay-panel">
      <div class="overlay-header">
        <button class="overlay-back" id="ledger-detail-back">&larr; Back</button>
        <div class="overlay-title" id="ledger-detail-title"></div>
        <button class="export-btn" id="ledger-statement-pdf-btn">Statement PDF</button>
      </div>
      <div class="date-range-bar">
        <input type="date" id="ledger-date-from">
        <span class="date-range-sep">to</span>
        <input type="date" id="ledger-date-to">
        <button class="date-range-reset" id="ledger-date-reset">Reset</button>
      </div>
      <div class="overlay-body" id="ledger-detail-body"></div>
    </div>
  </div>

  <!-- Voucher Detail / Invoice Overlay -->
  <div id="voucher-detail-overlay" class="overlay">
    <div class="overlay-panel">
      <div class="overlay-header">
        <button class="overlay-back" id="voucher-detail-back">&larr; Back</button>
        <div class="overlay-title">Invoice</div>
        <button class="export-btn" id="voucher-export-pdf-btn">Export PDF</button>
      </div>
      <div class="overlay-body" id="voucher-detail-body"></div>
    </div>
  </div>
</div>

<!-- Firebase (modular SDK) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA2h5SVC9gCPmiFq0rqmaZ667RR97dqD7Q",
    authDomain: "tallymobile-cfbed.firebaseapp.com",
    databaseURL: "https://tallymobile-cfbed-default-rtdb.firebaseio.com",
    projectId: "tallymobile-cfbed",
    storageBucket: "tallymobile-cfbed.firebasestorage.app",
    messagingSenderId: "924541599981",
    appId: "1:924541599981:web:6896f5afa95ee98bf3cce4"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const db = getDatabase(firebaseApp);

  // ================= CONFIG =================
  const COMPANIES = [
    { key: "shivam_hardware", label: "Shivam Hardware" },
    { key: "satyam_traders", label: "Satyam Traders" },
    { key: "shivam_traders", label: "Shivam Traders" },
  ];

  // SHA-256 hash of the access code. Default code: "shivam2026"
  // To change: run in any browser console:
  //   crypto.subtle.digest('SHA-256', new TextEncoder().encode('yourcode'))
  //     .then(b => console.log(Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')))
  const ACCESS_CODE_HASH = "dba45ed3a18527c10f48501158da825fa2a6ef833da91b78a6cde9b66da59719";

  const SESSION_KEY = "tallymobile_session";
  const SESSION_HOURS = 24;

  // ================= STATE =================
  let currentCompany = COMPANIES[0].key;
  let appInitialized = false;
  let currentUnsubscribe = null;

  // Heavy sections (ledgers, daybook, stock_items, sales_vouchers,
  // party_details) are loaded lazily, one-time, per section — not as part
  // of the initial page load. This is what makes the app open fast: only
  // company_info + outstanding_receivables (small) load immediately.
  const LAZY_PATHS = {
    ledgers: 'ledgers',
    daybook: 'daybook',
    stock_items: 'stock_items',
    sales_vouchers: 'sales_vouchers',
    party_details: 'party_details',
    bank_related_vouchers: 'bank_related_vouchers',
    profit_and_loss: 'profit_and_loss',
    balance_sheet: 'balance_sheet',
  };
  let sectionLoadState = {}; // companyKey -> { pathKey: 'loading' | 'loaded' }
  let currentSection = "home";
  let searchTerm = "";
  let companyData = {}; // key -> { ledgers, outstanding_receivables, daybook, stock_items, last_synced }

  // ================= AUTH =================
  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function checkExistingSession() {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return false;
    try {
      const session = JSON.parse(raw);
      const ageHours = (Date.now() - session.ts) / (1000 * 60 * 60);
      return ageHours < SESSION_HOURS;
    } catch { return false; }
  }

  const COMPANY_SELECTION_KEY = "tallymobile_selected_company";

  document.getElementById('login-btn').addEventListener('click', attemptLogin);
  document.getElementById('password-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') attemptLogin();
  });

  async function attemptLogin() {
    const input = document.getElementById('password-input').value;
    const hash = await sha256(input);
    if (hash === ACCESS_CODE_HASH) {
      localStorage.setItem(SESSION_KEY, JSON.stringify({ ts: Date.now() }));
      afterLogin();
    } else {
      document.getElementById('login-error').textContent = "Incorrect access code.";
    }
  }

  function afterLogin() {
    document.getElementById('login-screen').style.display = 'none';
    const savedCompany = localStorage.getItem(COMPANY_SELECTION_KEY);
    if (savedCompany && COMPANIES.some(c => c.key === savedCompany)) {
      currentCompany = savedCompany;
      showApp();
    } else {
      showCompanySelect();
    }
  }

  function showCompanySelect() {
    document.getElementById('app-screen').style.display = 'none';
    document.getElementById('company-select-screen').style.display = 'block';
    const list = document.getElementById('company-select-list');
    list.innerHTML = '';
    COMPANIES.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'company-card';
      btn.innerHTML = `<span class="cc-name">${c.label}</span><span class="cc-arrow">&rarr;</span>`;
      btn.addEventListener('click', () => {
        localStorage.setItem(COMPANY_SELECTION_KEY, c.key);
        currentCompany = c.key;
        showApp();
      });
      list.appendChild(btn);
    });
  }

  function showApp() {
    document.getElementById('company-select-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
    document.getElementById('company-switcher-name').textContent =
      COMPANIES.find(c => c.key === currentCompany)?.label || '';
    initApp();
    listenToCurrentCompany(); // always (re)subscribe — handles company switching too
  }

  if (checkExistingSession()) {
    afterLogin();
  }

  document.getElementById('company-switcher-btn').addEventListener('click', () => {
    showCompanySelect();
  });

  // ================= APP INIT =================
  function initApp() {
    if (appInitialized) return; // one-time UI wiring only
    appInitialized = true;
    attachSectionNav();
    attachSearch();
    attachExportButtons();
  }

  function attachSectionNav() {
    document.querySelectorAll('.bottom-nav-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.bottom-nav-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSection = btn.dataset.section;
        document.getElementById('search-input').value = '';
        searchTerm = '';
        render();
      });
    });
  }

  function attachSearch() {
    document.getElementById('search-input').addEventListener('input', e => {
      searchTerm = e.target.value.toLowerCase();
      render();
    });
  }

  function listenToCurrentCompany() {
    if (currentUnsubscribe) {
      currentUnsubscribe();
      currentUnsubscribe = null;
    }
    document.getElementById('sync-text').textContent = 'Loading…';
    companyData[currentCompany] = companyData[currentCompany] || {};
    sectionLoadState[currentCompany] = sectionLoadState[currentCompany] || {};

    // Lightweight, always-live: company_info, outstanding_receivables, last_synced
    const companyRef = ref(db, `companies/${currentCompany}`);
    currentUnsubscribe = onValue(companyRef, snapshot => {
      const val = snapshot.val() || {};
      const cd = companyData[currentCompany];
      cd.company_info = val.company_info;
      cd.outstanding_receivables = val.outstanding_receivables;
      cd.last_synced = val.last_synced;
      document.getElementById('sync-text').textContent = 'Live';
      render();
    }, error => {
      document.getElementById('sync-text').textContent = 'Connection error';
      console.error(error);
    });
  }

  // Ensures a heavy section is loaded (once) before a section that needs
  // it renders. Triggers a one-time fetch if not already loaded/loading,
  // and re-renders when it arrives. Returns true if data is ready now.
  function ensureSectionLoaded(companyKey, ...pathKeys) {
    const state = sectionLoadState[companyKey] || (sectionLoadState[companyKey] = {});
    let allReady = true;
    pathKeys.forEach(pathKey => {
      if (state[pathKey] === 'loaded') return;
      allReady = false;
      if (state[pathKey] === 'loading') return;
      state[pathKey] = 'loading';
      const path = LAZY_PATHS[pathKey];
      get(ref(db, `companies/${companyKey}/${path}`)).then(snapshot => {
        state[pathKey] = 'loaded';
        companyData[companyKey] = companyData[companyKey] || {};
        companyData[companyKey][pathKey] = snapshot.val();
        if (companyKey === currentCompany) {
          render();
          refreshOpenOverlays();
        }
      }).catch(err => {
        state[pathKey] = null; // allow retry
        console.error(`Failed to load ${pathKey} for ${companyKey}:`, err);
        if (companyKey === currentCompany) render();
      });
    });
    return allReady;
  }

  // ================= RENDER =================
  function render() {
    const data = companyData[currentCompany];
    const contentArea = document.getElementById('content-area');
    const summaryStrip = document.getElementById('summary-strip');
    const footer = document.getElementById('last-synced-footer');
    const searchBarRow = document.getElementById('search-bar-row');

    if (!data) {
      contentArea.innerHTML = '<div class="loading-state">Loading data…</div>';
      summaryStrip.innerHTML = '';
      footer.textContent = '';
      return;
    }

    footer.textContent = data.last_synced ? `Last synced: ${formatDateTime(data.last_synced)}` : '';

    searchBarRow.style.display = (currentSection === 'home' || currentSection === 'pnl' || currentSection === 'balancesheet') ? 'none' : 'flex';

    if (currentSection === 'home') renderHome(data, contentArea, summaryStrip);
    else if (currentSection === 'outstanding') renderOutstanding(data, contentArea, summaryStrip);
    else if (currentSection === 'ledgers') renderLedgers(data, contentArea, summaryStrip);
    else if (currentSection === 'daybook') renderDaybook(data, contentArea, summaryStrip);
    else if (currentSection === 'stock') renderStock(data, contentArea, summaryStrip);
    else if (currentSection === 'pnl') renderProfitAndLoss(data, contentArea, summaryStrip);
    else if (currentSection === 'balancesheet') renderBalanceSheet(data, contentArea, summaryStrip);
  }

  function goToSection(section) {
    currentSection = section;
    document.querySelectorAll('.bottom-nav-tab').forEach(b => {
      b.classList.toggle('active', b.dataset.section === section);
    });
    render();
  }

  function renderHome(data, contentArea, summaryStrip) {
    summaryStrip.innerHTML = '';

    // Outstanding is always-live (small), renders immediately.
    const outstanding = safeArray(data.outstanding_receivables);
    const totalOutstanding = outstanding.reduce((s, r) => s + parseAmt(r.outstanding), 0);

    // Ledgers/Stock/Daybook are heavy — kick off lazy loads and show a
    // placeholder until each arrives, rather than blocking the whole page.
    const ledgersReady = ensureSectionLoaded(currentCompany, 'ledgers');
    const stockReady = ensureSectionLoaded(currentCompany, 'stock_items');
    const daybookReady = ensureSectionLoaded(currentCompany, 'daybook');

    const ledgerCount = ledgersReady ? safeArray(data.ledgers).length : '…';
    const stockValue = stockReady ? formatCurrency(safeArray(data.stock_items).reduce((s, r) => s + parseAmt(r.closing_value), 0)) : '…';
    const voucherCount = daybookReady ? safeArray(data.daybook).length : '…';
    const companyLabel = COMPANIES.find(c => c.key === currentCompany)?.label || '';

    contentArea.innerHTML = `
      <div class="dash-greeting">Welcome back</div>
      <div class="dash-company-name">${escapeHtml(companyLabel)}</div>

      <div class="dash-stat-grid">
        <div class="dash-stat-card primary">
          <div class="ds-label">Total Outstanding</div>
          <div class="ds-value">${formatCurrency(totalOutstanding)}</div>
        </div>
        <div class="dash-stat-card">
          <div class="ds-label">Stock Value</div>
          <div class="ds-value">${stockValue}</div>
        </div>
        <div class="dash-stat-card">
          <div class="ds-label">Ledgers</div>
          <div class="ds-value">${ledgerCount}</div>
        </div>
        <div class="dash-stat-card">
          <div class="ds-label">Vouchers (1yr)</div>
          <div class="ds-value">${voucherCount}</div>
        </div>
      </div>

      <div class="dash-section-title">Reports</div>
      <div class="dash-tile-grid">
        <button class="dash-tile" data-goto="outstanding">
          <span class="dt-icon" style="background:var(--rust-soft); color:var(--rust);">₹</span>
          <span class="dt-label">Outstanding</span>
        </button>
        <button class="dash-tile" data-goto="ledgers">
          <span class="dt-icon" style="background:var(--primary-soft); color:var(--primary);">▤</span>
          <span class="dt-label">Ledgers</span>
        </button>
        <button class="dash-tile" data-goto="daybook">
          <span class="dt-icon" style="background:var(--amber-soft); color:var(--amber);">▦</span>
          <span class="dt-label">Day Book</span>
        </button>
        <button class="dash-tile" data-goto="stock">
          <span class="dt-icon" style="background:var(--forest-soft); color:var(--forest);">◫</span>
          <span class="dt-label">Stock</span>
        </button>
        <button class="dash-tile" data-goto="pnl">
          <span class="dt-icon" style="background:var(--primary-soft); color:var(--primary);">△</span>
          <span class="dt-label">P&amp;L</span>
        </button>
        <button class="dash-tile" data-goto="balancesheet">
          <span class="dt-icon" style="background:var(--amber-soft); color:var(--amber);">▭</span>
          <span class="dt-label">Balance Sheet</span>
        </button>
      </div>
    `;

    contentArea.querySelectorAll('.dash-tile').forEach(tile => {
      tile.addEventListener('click', () => goToSection(tile.dataset.goto));
    });
  }

  function renderOutstanding(data, contentArea, summaryStrip) {
    let rows = safeArray(data.outstanding_receivables);
    rows = rows.filter(r => (r.party || '').toLowerCase().includes(searchTerm));
    rows = [...rows].sort((a, b) => parseAmt(b.outstanding) - parseAmt(a.outstanding));

    const total = rows.reduce((sum, r) => sum + parseAmt(r.outstanding), 0);
    summaryStrip.innerHTML = `
      <div class="summary-chip rust">
        <div class="label">Total Outstanding</div>
        <div class="value mono">${formatCurrency(total)}</div>
      </div>
      <div class="summary-chip">
        <div class="label">Parties</div>
        <div class="value mono">${rows.length}</div>
      </div>
    `;

    if (rows.length === 0) {
      contentArea.innerHTML = emptyState('No outstanding dues', 'Everything is settled — or no data matches your search.');
      return;
    }

    contentArea.innerHTML = `<div class="list-card">${rows.map(r => `
      <div class="row clickable-row" data-party="${escapeHtml(r.party || '')}">
        <div>
          <div class="name">${escapeHtml(r.party || '—')}</div>
          <div class="sub">${escapeHtml(r.group || '')}</div>
        </div>
        <div class="amount negative mono">${formatCurrency(parseAmt(r.outstanding))}</div>
      </div>
    `).join('')}</div>`;
    attachRowClickHandlers(contentArea);
  }

  let ledgerFilter = 'all'; // 'all' | 'debtors' | 'creditors' | 'other'

  function classifyLedger(group) {
    const g = (group || '').trim().toLowerCase();
    if (g === 'sundry debtors') return 'debtors';
    if (g === 'sundry creditors') return 'creditors';
    return 'other';
  }

  function renderLedgers(data, contentArea, summaryStrip) {
    if (!ensureSectionLoaded(currentCompany, 'ledgers')) {
      contentArea.innerHTML = '<div class="loading-state">Loading ledgers…</div>';
      summaryStrip.innerHTML = '';
      return;
    }
    let rows = safeArray(data.ledgers);
    rows = rows.filter(r => (r.name || '').toLowerCase().includes(searchTerm));
    if (ledgerFilter !== 'all') {
      rows = rows.filter(r => classifyLedger(r.group) === ledgerFilter);
    }
    rows = [...rows].sort((a, b) => (a.name || '').localeCompare(b.name || ''));

    const allRows = safeArray(data.ledgers);
    const debtorCount = allRows.filter(r => classifyLedger(r.group) === 'debtors').length;
    const creditorCount = allRows.filter(r => classifyLedger(r.group) === 'creditors').length;

    summaryStrip.innerHTML = `
      <div class="summary-chip">
        <div class="label">Total Ledgers</div>
        <div class="value mono">${allRows.length}</div>
      </div>
      <div class="summary-chip">
        <div class="label">Debtors</div>
        <div class="value mono">${debtorCount}</div>
      </div>
      <div class="summary-chip">
        <div class="label">Creditors</div>
        <div class="value mono">${creditorCount}</div>
      </div>
    `;

    const filterChipsHtml = `
      <div class="filter-chips">
        <button class="filter-chip ${ledgerFilter === 'all' ? 'active' : ''}" data-filter="all">All</button>
        <button class="filter-chip ${ledgerFilter === 'debtors' ? 'active' : ''}" data-filter="debtors">Sundry Debtors</button>
        <button class="filter-chip ${ledgerFilter === 'creditors' ? 'active' : ''}" data-filter="creditors">Sundry Creditors</button>
        <button class="filter-chip ${ledgerFilter === 'other' ? 'active' : ''}" data-filter="other">Other</button>
      </div>
    `;

    if (rows.length === 0) {
      contentArea.innerHTML = filterChipsHtml + emptyState('No ledgers found', 'Try a different search term or filter.');
      attachFilterChipHandlers(contentArea);
      return;
    }

    contentArea.innerHTML = filterChipsHtml + `<div class="list-card">${rows.slice(0, 300).map(r => {
      const bal = parseAmt(r.closing_balance);
      const cls = bal > 0 ? 'positive' : bal < 0 ? 'negative' : 'neutral';
      const kind = classifyLedger(r.group);
      const badge = kind === 'debtors' ? '<span class="badge badge-debtor">Debtor</span>' :
                    kind === 'creditors' ? '<span class="badge badge-creditor">Creditor</span>' : '';
      return `
      <div class="row clickable-row" data-party="${escapeHtml(r.name || '')}">
        <div>
          <div class="name">${escapeHtml(r.name || '—')}</div>
          <div class="sub">${escapeHtml(r.group || '')} ${badge}</div>
        </div>
        <div class="amount ${cls} mono">${formatCurrency(bal)}</div>
      </div>`;
    }).join('')}</div>
    ${rows.length > 300 ? `<div class="loading-state">Showing first 300 of ${rows.length} — narrow your search to see more.</div>` : ''}`;
    attachRowClickHandlers(contentArea);
    attachFilterChipHandlers(contentArea);
  }

  function attachFilterChipHandlers(container) {
    container.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        ledgerFilter = chip.dataset.filter;
        render();
      });
    });
  }

  function renderDaybook(data, contentArea, summaryStrip) {
    if (!ensureSectionLoaded(currentCompany, 'daybook')) {
      contentArea.innerHTML = '<div class="loading-state">Loading day book…</div>';
      summaryStrip.innerHTML = '';
      return;
    }
    let rows = safeArray(data.daybook);
    rows = rows.filter(r =>
      (r.party || '').toLowerCase().includes(searchTerm) ||
      (r.voucher_type || '').toLowerCase().includes(searchTerm) ||
      (r.narration || '').toLowerCase().includes(searchTerm)
    );

    summaryStrip.innerHTML = `
      <div class="summary-chip">
        <div class="label">Vouchers</div>
        <div class="value mono">${rows.length}</div>
      </div>
    `;

    if (rows.length === 0) {
      contentArea.innerHTML = emptyState('No vouchers found', 'Try a different search term, or check back after the next sync.');
      return;
    }

    contentArea.innerHTML = `<div class="list-card">${rows.map(r => {
      const isSales = (r.voucher_type || '').toLowerCase() === 'sales';
      return `
      <div class="row ${isSales ? 'clickable-row' : ''}" ${isSales ? `data-vdate="${escapeHtml(r.date || '')}" data-vnum="${escapeHtml(r.voucher_number || '')}"` : ''}>
        <div>
          <div class="name">${escapeHtml(r.party || r.voucher_type || '—')}</div>
          <div class="sub">${escapeHtml(r.voucher_type || '')} ${r.voucher_number ? '#' + escapeHtml(r.voucher_number) : ''} &middot; ${escapeHtml(formatTallyDate(r.date))}${isSales ? ' · tap to view invoice' : ''}</div>
          ${r.narration ? `<div class="sub" style="font-style:italic; margin-top:2px;">${escapeHtml(r.narration)}</div>` : ''}
        </div>
        <div class="amount neutral mono">${formatCurrency(parseAmt(r.amount))}</div>
      </div>`;
    }).join('')}</div>`;
    contentArea.querySelectorAll('.clickable-row').forEach(row => {
      row.addEventListener('click', () => {
        ensureSectionLoaded(currentCompany, 'sales_vouchers');
        openVoucherDetail(row.dataset.vdate, row.dataset.vnum);
      });
    });
  }

  function renderStock(data, contentArea, summaryStrip) {
    if (!ensureSectionLoaded(currentCompany, 'stock_items')) {
      contentArea.innerHTML = '<div class="loading-state">Loading stock…</div>';
      summaryStrip.innerHTML = '';
      return;
    }
    let rows = safeArray(data.stock_items);
    rows = rows.filter(r => (r.name || '').toLowerCase().includes(searchTerm));
    rows = [...rows].sort((a, b) => (a.name || '').localeCompare(b.name || ''));

    const totalValue = rows.reduce((sum, r) => sum + parseAmt(r.closing_value), 0);
    summaryStrip.innerHTML = `
      <div class="summary-chip forest">
        <div class="label">Stock Value</div>
        <div class="value mono">${formatCurrency(totalValue)}</div>
      </div>
      <div class="summary-chip">
        <div class="label">Items</div>
        <div class="value mono">${rows.length}</div>
      </div>
    `;

    if (rows.length === 0) {
      contentArea.innerHTML = emptyState('No stock items found', 'Try a different search term.');
      return;
    }

    contentArea.innerHTML = `<div class="list-card">${rows.slice(0, 300).map(r => `
      <div class="row">
        <div>
          <div class="name">${escapeHtml(r.name || '—')}</div>
          <div class="sub">${escapeHtml(r.group || '')}</div>
        </div>
        <div>
          <div class="amount neutral mono" style="text-align:right">${r.closing_qty || '0'}</div>
          <div class="sub" style="text-align:right">${formatCurrency(parseAmt(r.closing_value))}</div>
        </div>
      </div>
    `).join('')}</div>
    ${rows.length > 300 ? `<div class="loading-state">Showing first 300 of ${rows.length} — narrow your search to see more.</div>` : ''}`;
  }

  function renderGroupRow(g, depth = 0, useAbsolute = false) {
    const rawAmt = parseAmt(g.amount);
    // Balance Sheet: Tally's own screen always shows positive magnitudes
    // per group (the column position, not the sign, conveys Asset vs
    // Liability) — confirmed against a real side-by-side comparison, our
    // raw export's internal sign isn't a reliable Dr/Cr indicator for
    // this specific report. P&L's sign IS meaningful (verified against
    // real data), so it keeps its signed/colored display.
    const amt = useAbsolute ? Math.abs(rawAmt) : rawAmt;
    const cls = useAbsolute ? 'neutral' : (amt > 0 ? 'positive' : amt < 0 ? 'negative' : 'neutral');
    const indent = depth > 0 ? `padding-left: ${14 + depth * 16}px;` : '';
    const childrenHtml = (g.children || []).map(c => renderGroupRow(c, depth + 1, useAbsolute)).join('');
    const groupNameAttr = escapeHtml((g.name || '').replace(/\s*:\s*$/, '')); // strip trailing ':' like "Cost of Sales :"
    return `
      <div class="row clickable-row" data-group-name="${groupNameAttr}" style="${indent}">
        <div class="name" style="${depth > 0 ? 'font-weight:500; color:var(--ink-soft); font-size:13px;' : ''}">${escapeHtml(g.name || '—')}</div>
        <div class="amount ${cls} mono">${formatCurrency(amt)}</div>
      </div>
    ` + childrenHtml;
  }

  function renderProfitAndLoss(data, contentArea, summaryStrip) {
    if (!ensureSectionLoaded(currentCompany, 'profit_and_loss')) {
      contentArea.innerHTML = '<div class="loading-state">Loading P&amp;L…</div>';
      summaryStrip.innerHTML = '';
      return;
    }
    const groups = safeArray(data.profit_and_loss);

    if (groups.length === 0) {
      contentArea.innerHTML = emptyState('No P&L data', 'Check back after the next sync.');
      summaryStrip.innerHTML = '';
      return;
    }

    // Net Profit/Loss is the sum of every top-level group — verified
    // against real data before shipping this (income groups are
    // positive, cost/expense groups negative, in Tally's own export).
    const netProfit = groups.reduce((s, g) => s + parseAmt(g.amount), 0);

    summaryStrip.innerHTML = `
      <div class="summary-chip ${netProfit >= 0 ? 'forest' : 'rust'}">
        <div class="label">${netProfit >= 0 ? 'Net Profit' : 'Net Loss'}</div>
        <div class="value mono">${formatCurrency(Math.abs(netProfit))}</div>
      </div>
    `;

    contentArea.innerHTML = `<div class="list-card">${groups.map(g => renderGroupRow(g)).join('')}</div>`;
    contentArea.querySelectorAll('.clickable-row').forEach(row => {
      row.addEventListener('click', () => openGroupDetail(row.dataset.groupName));
    });
  }

  function renderBalanceSheet(data, contentArea, summaryStrip) {
    if (!ensureSectionLoaded(currentCompany, 'balance_sheet')) {
      contentArea.innerHTML = '<div class="loading-state">Loading Balance Sheet…</div>';
      summaryStrip.innerHTML = '';
      return;
    }
    const groups = safeArray(data.balance_sheet);

    if (groups.length === 0) {
      contentArea.innerHTML = emptyState('No Balance Sheet data', 'Check back after the next sync.');
      summaryStrip.innerHTML = '';
      return;
    }

    summaryStrip.innerHTML = `
      <div class="summary-chip">
        <div class="label">Groups</div>
        <div class="value mono">${groups.length}</div>
      </div>
    `;

    contentArea.innerHTML = `
      <div class="loading-state" style="text-align:left; padding: 10px 4px; font-size:12px;">
        Figures shown as absolute values per group, same as Tally's own Balance Sheet screen (column position — not sign — indicates Asset vs Liability).
      </div>
      <div class="list-card">${groups.map(g => renderGroupRow(g, 0, true)).join('')}</div>
    `;
    contentArea.querySelectorAll('.clickable-row').forEach(row => {
      row.addEventListener('click', () => openGroupDetail(row.dataset.groupName));
    });
  }

  function openGroupDetail(groupName) {
    const data = companyData[currentCompany] || {};
    const ledgersReady = ensureSectionLoaded(currentCompany, 'ledgers');

    document.getElementById('group-detail-title').textContent = groupName;
    const body = document.getElementById('group-detail-body');

    if (!ledgersReady) {
      body.innerHTML = '<div class="loading-state">Loading ledgers…</div>';
      document.getElementById('group-detail-overlay').classList.add('open');
      return;
    }

    // Matches ledgers whose direct parent group equals this P&L/BS group
    // name — works well when ledgers sit directly under the group shown
    // (common in most setups). Ledgers several sub-group levels deeper
    // won't show here since we only sync each ledger's immediate parent.
    const ledgers = safeArray(data.ledgers).filter(l => (l.group || '') === groupName);

    if (ledgers.length === 0) {
      body.innerHTML = emptyState(
        'No ledgers found directly under this group',
        'This group may only contain sub-groups rather than ledgers directly, which isn\'t something we can drill into yet.'
      );
    } else {
      const sorted = [...ledgers].sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      body.innerHTML = `
        <div class="summary-strip" style="margin-bottom:14px;">
          <div class="summary-chip">
            <div class="label">Ledgers</div>
            <div class="value mono">${sorted.length}</div>
          </div>
        </div>
        <div class="list-card">${sorted.map(l => {

          <div class="row clickable-row" data-party="${escapeHtml(l.name || '')}">
            <div class="name">${escapeHtml(l.name || '—')}</div>
            <div class="amount ${cls} mono">${formatCurrency(bal)}</div>
          </div>`;
        }).join('')}</div>
      `;
      body.querySelectorAll('.clickable-row').forEach(row => {
        row.addEventListener('click', () => {
          document.getElementById('group-detail-overlay').classList.remove('open');
          openLedgerDetail(row.dataset.party);
        });
      });
    }

    document.getElementById('group-detail-overlay').classList.add('open');
  }

  document.getElementById('group-detail-back').addEventListener('click', () => {
    document.getElementById('group-detail-overlay').classList.remove('open');
  });

  function emptyState(title, desc) {
    return `<div class="empty-state">
      <div class="glyph">◇</div>

  // ================= LEDGER DRILL-DOWN =================
  function attachRowClickHandlers(container) {
    container.querySelectorAll('.clickable-row').forEach(row => {
      row.addEventListener('click', () => {
        const party = row.dataset.party;
        if (party) openLedgerDetail(party);

  // Merges the light daybook (all voucher types, no ledger lines) with
  // bank_related_vouchers (Payment/Receipt/Contra only, WITH ledger lines)
  // — preferring the enriched version wherever the same voucher exists in
  // both, so bank ledger lookups can find every voucher that touches them.
  function getEnrichedDaybook(data) {
    const daybook = safeArray(data.daybook);
    const bankVouchers = safeArray(data.bank_related_vouchers);
    const bankMap = new Map();
    bankVouchers.forEach(v => bankMap.set(`${v.date}|${v.voucher_number}`, v));

    return daybook.map(v => bankMap.get(`${v.date}|${v.voucher_number}`) || v);
  }

  // Tally's PartyLedgerName field isn't reliably the ledger being viewed —
  // for Payment/Receipt/Contra vouchers it can point to the OTHER side of
  // the transaction. Checking ledger_lines too catches every voucher that
  // actually involves this ledger, not just ones where it happened to be
  // recorded as "the party".
  function voucherInvolvesLedger(v, ledgerName) {
    if ((v.party || '') === ledgerName) return true;
    return safeArray(v.ledger_lines).some(l => l.ledger_name === ledgerName);
  }

  let currentLedgerDetailParty = null;

  // Anchors a party's running balance to the ledger's real current closing
  // balance and works backward — shared by both the on-screen summary and
  // the PDF export so they can never disagree with each other.
  function computeAnchoredStatementRows(vouchers, partyName, liveClosingBalance) {
    if (liveClosingBalance === null) return buildLedgerStatementRows(vouchers, partyName, 0);
    const unanchored = buildLedgerStatementRows(vouchers, partyName, 0);
    const netChange = unanchored.length ? unanchored[unanchored.length - 1].balance : 0;
    const openingBalance = liveClosingBalance - netChange;
    return buildLedgerStatementRows(vouchers, partyName, openingBalance);
  }

  function tallyDateToInputFormat(d) {
    if (!d || !/^\d{8}$/.test(d)) return '';
    return `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)}`;
  }
  function inputFormatToTallyDate(d) {
    return d ? d.replace(/-/g, '') : null;
  }

  // null = no filter applied (shows full synced range). Once the person
  // picks dates, both the on-screen view and the PDF export respect them.
  let statementDateFilter = { from: null, to: null };

  function refreshOpenOverlays() {
    if (document.getElementById('ledger-detail-overlay').classList.contains('open') && currentLedgerDetailParty) {
      openLedgerDetail(currentLedgerDetailParty);

    if (document.getElementById('voucher-detail-overlay').classList.contains('open') && currentVoucherLookup) {
      openVoucherDetail(currentVoucherLookup.date, currentVoucherLookup.voucherNumber);

  function openLedgerDetail(partyName) {
    currentLedgerDetailParty = partyName;
    const data = companyData[currentCompany] || {};

    const daybookReady = ensureSectionLoaded(currentCompany, 'daybook', 'bank_related_vouchers');
    ensureSectionLoaded(currentCompany, 'party_details'); // used for buyer info if a Sales voucher is opened from here
    ensureSectionLoaded(currentCompany, 'ledgers');

    document.getElementById('ledger-detail-title').textContent = partyName;
    const body = document.getElementById('ledger-detail-body');

    if (!daybookReady) {
      body.innerHTML = '<div class="loading-state">Loading transaction history…</div>';
      document.getElementById('ledger-detail-overlay').classList.add('open');
      return;
    }

    const allVouchers = getEnrichedDaybook(data).filter(v => voucherInvolvesLedger(v, partyName));

    // Pre-fill the date inputs to the full available span, but only while
    // no filter has been applied yet — once the person picks dates, don't
    // overwrite their choice on re-render.
    const fromInput = document.getElementById('ledger-date-from');
    const toInput = document.getElementById('ledger-date-to');
    if (!statementDateFilter.from && !statementDateFilter.to && allVouchers.length > 0) {
      const dates = allVouchers.map(v => v.date).filter(Boolean).sort();
      fromInput.value = tallyDateToInputFormat(dates[0]);
      toInput.value = tallyDateToInputFormat(dates[dates.length - 1]);
    }

    const fromFilter = statementDateFilter.from;
    const toFilter = statementDateFilter.to;
    const vouchers = allVouchers
      .filter(v => (!fromFilter || (v.date && v.date >= fromFilter)) && (!toFilter || (v.date && v.date <= toFilter)))
      .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

    if (vouchers.length === 0) {
      body.innerHTML = emptyState('No vouchers found', `No transactions for ${escapeHtml(partyName)} in the selected range.`);
    } else {
      // Balance as of the END of the selected range — not always today's
      // live balance, since the person might be looking at a past period.
      const ledgerEntry = safeArray(data.ledgers).find(l => l.name === partyName);
      const liveClosingBalance = ledgerEntry ? -parseAmt(ledgerEntry.closing_balance) : null;

      let displayBalance = liveClosingBalance;
      let balanceCaption = 'Closing Balance';
      if (toFilter && liveClosingBalance !== null) {
        const anchoredRows = computeAnchoredStatementRows(allVouchers, partyName, liveClosingBalance);
        const rowsUpToDate = anchoredRows.filter(r => r.date && r.date <= toFilter);
        if (rowsUpToDate.length > 0) {
          displayBalance = rowsUpToDate[rowsUpToDate.length - 1].balance;
          balanceCaption = `Balance as of ${formatTallyDate(toFilter)}`;
        }
      }
      const closingLabel = displayBalance === null
        ? '…'
        : `${formatCurrency(Math.abs(displayBalance))} ${displayBalance >= 0 ? 'Dr' : 'Cr'}`;

      body.innerHTML = `
        <div class="summary-strip" style="margin-bottom:14px;">
          <div class="summary-chip">
            <div class="label">Vouchers</div>
            <div class="value mono">${vouchers.length}</div>
          </div>
          <div class="summary-chip">
            <div class="label">${escapeHtml(balanceCaption)}</div>
            <div class="value mono">${closingLabel}</div>
          </div>
        </div>
        <div class="list-card">${vouchers.map(v => {
          const isSales = (v.voucher_type || '').toLowerCase() === 'sales';
          const lines = safeArray(v.ledger_lines);
          const otherLine = lines.find(l => l.ledger_name !== partyName);
          const displayName = otherLine ? otherLine.ledger_name : (v.voucher_type || '—');
          const vchLabel = `${escapeHtml(v.voucher_type || '')}${v.voucher_number ? ' #' + escapeHtml(v.voucher_number) : ''}`;
          return `
          <div class="row ${isSales ? 'clickable-row' : ''}" ${isSales ? `data-vdate="${escapeHtml(v.date || '')}" data-vnum="${escapeHtml(v.voucher_number || '')}"` : ''}>
            <div>
              <div class="name">${escapeHtml(displayName)}</div>
              <div class="sub">${vchLabel} &middot; ${escapeHtml(formatTallyDate(v.date))}${isSales ? ' · tap to view invoice' : ''}</div>
              ${v.narration ? `<div class="sub" style="font-style:italic; margin-top:2px;">${escapeHtml(v.narration)}</div>` : ''}
            </div>
            <div class="amount neutral mono">${formatCurrency(parseAmt(v.amount))}</div>
          </div>`;
        }).join('')}</div>
      `;
      body.querySelectorAll('.clickable-row').forEach(row => {
        row.addEventListener('click', () => {
          openVoucherDetail(row.dataset.vdate, row.dataset.vnum);
        });
      });
    }

    document.getElementById('ledger-detail-overlay').classList.add('open');
  }

  document.getElementById('ledger-detail-back').addEventListener('click', () => {
    document.getElementById('ledger-detail-overlay').classList.remove('open');
  });

  document.getElementById('ledger-date-from').addEventListener('change', e => {
    statementDateFilter.from = inputFormatToTallyDate(e.target.value);
    if (currentLedgerDetailParty) openLedgerDetail(currentLedgerDetailParty);
  });
  document.getElementById('ledger-date-to').addEventListener('change', e => {
    statementDateFilter.to = inputFormatToTallyDate(e.target.value);
    if (currentLedgerDetailParty) openLedgerDetail(currentLedgerDetailParty);
  });
  document.getElementById('ledger-date-reset').addEventListener('click', () => {
    statementDateFilter = { from: null, to: null };
    if (currentLedgerDetailParty) openLedgerDetail(currentLedgerDetailParty);
  });

  const CONFIG_DAYS_LABEL = '1 year';

  // ---- Party Ledger Statement (Tally-style running balance) ----

  function buildLedgerStatementRows(vouchers, partyName, openingBalance = 0) {
    // Chronological ascending order, like Tally's own ledger statement
    const sorted = [...vouchers].sort((a, b) => (a.date || '').localeCompare(b.date || ''));

    let runningBalance = openingBalance;
    return sorted.map(v => {
      const lines = safeArray(v.ledger_lines);
      const partyLine = lines.find(l => l.ledger_name === partyName);
      // Fall back to the voucher's top-level amount if ledger_lines wasn't
      // synced yet for this voucher (older data before this feature)
      const partyAmt = partyLine ? parseAmt(partyLine.amount) : parseAmt(v.amount);

      const otherLines = lines.filter(l => l.ledger_name !== partyName);
      const primaryOther = otherLines[0];
      const particularsPrefix = partyAmt < 0 ? 'Cr' : 'Dr';
      const particulars = primaryOther
        ? `${particularsPrefix} ${primaryOther.ledger_name}`
        : (otherLines.length > 1 ? `${particularsPrefix} Sundries` : (v.voucher_type || ''));

      const debit = partyAmt < 0 ? Math.abs(partyAmt) : 0;
      const credit = partyAmt > 0 ? partyAmt : 0;
      runningBalance += (debit - credit);

      return {
        date: v.date,
        particulars,
        voucherType: v.voucher_type,
        voucherNumber: v.voucher_number,
        narration: v.narration,
        debit,
        credit,
        balance: runningBalance,
      };
    });
  }

  document.getElementById('ledger-statement-pdf-btn').addEventListener('click', exportLedgerStatementPDF);

  async function exportLedgerStatementPDF() {
    const partyName = currentLedgerDetailParty;
    if (!partyName) { alert('No party selected.'); return; }

    const data = companyData[currentCompany] || {};

    if (!ensureSectionLoaded(currentCompany, 'ledgers')) {
      alert('Still loading ledger data — try again in a moment.');
      return;
    }

    const allVouchers = getEnrichedDaybook(data).filter(v => voucherInvolvesLedger(v, partyName));
    if (allVouchers.length === 0) { alert('No transactions to export.'); return; }

    if (!window.jspdf) {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    const companyLabel = COMPANIES.find(c => c.key === currentCompany)?.label || currentCompany;
    const companyInfo = data.company_info || {};
    const buyerLedger = (data.party_details || {})[partyName] || safeArray(Object.values(data.party_details || {})).find(p => p.name === partyName) || {};

    // Anchor to the ledger's real current closing balance (see
    // computeAnchoredStatementRows), then slice to whatever date range is
    // currently selected in the UI — the opening balance shown is
    // whatever the running balance was immediately before that range
    // started, not just zero.
    const ledgerEntry = safeArray(data.ledgers).find(l => l.name === partyName);
    const liveClosingBalance = ledgerEntry ? -parseAmt(ledgerEntry.closing_balance) : null;
    const anchoredRows = computeAnchoredStatementRows(allVouchers, partyName, liveClosingBalance);

    const fromFilter = statementDateFilter.from;
    const toFilter = statementDateFilter.to;
    const rowsBeforeRange = anchoredRows.filter(r => fromFilter && r.date && r.date < fromFilter);
    const openingBalance = rowsBeforeRange.length > 0
      ? rowsBeforeRange[rowsBeforeRange.length - 1].balance
      : (anchoredRows.length ? anchoredRows[0].balance - (anchoredRows[0].debit - anchoredRows[0].credit) : 0);

    const rows = anchoredRows.filter(r =>
      (!fromFilter || (r.date && r.date >= fromFilter)) && (!toFilter || (r.date && r.date <= toFilter))
    );
    if (rows.length === 0) { alert('No transactions in the selected date range.'); return; }

    const fromDate = formatTallyDate(rows[0].date);
    const toDate = formatTallyDate(rows[rows.length - 1].date);
    const closingBalance = rows[rows.length - 1].balance;
    const totalDebit = rows.reduce((s, r) => s + r.debit, 0);
    const totalCredit = rows.reduce((s, r) => s + r.credit, 0);

    const pageWidth = 210;
    const marginX = 10;
    const contentWidth = pageWidth - marginX * 2;
    let y = 12;

    doc.setFontSize(13);
    doc.setFont(undefined, 'bold');
    doc.text(companyLabel.toUpperCase(), pageWidth / 2, y, { align: 'center' });
    y += 5;
    doc.setFontSize(8.5);
    doc.setFont(undefined, 'normal');
    if (companyInfo.address) {
      const addrLine = companyInfo.address.split(/[\n,]+/).map(l => l.trim()).filter(Boolean).join(', ');
      doc.text(addrLine, pageWidth / 2, y, { align: 'center', maxWidth: contentWidth });
      y += 4;
    }
    if (companyInfo.email) {
      doc.text(`E-Mail: ${companyInfo.email}`, pageWidth / 2, y, { align: 'center' });
      y += 4;
    }
    doc.line(marginX + 40, y, pageWidth - marginX - 40, y);
    y += 6;

    doc.setFontSize(12);
    doc.setFont(undefined, 'bold');
    doc.text(partyName, pageWidth / 2, y, { align: 'center' });
    y += 5;
    doc.setFontSize(9);
    doc.setFont(undefined, 'normal');
    doc.text('Ledger Account', pageWidth / 2, y, { align: 'center' });
    y += 5;
    if (buyerLedger.address) {
      const addrLine = buyerLedger.address.split(/[\n,]+/).map(l => l.trim()).filter(Boolean).join(', ');
      doc.text(addrLine, pageWidth / 2, y, { align: 'center', maxWidth: contentWidth });
      y += 5;
    }
    doc.setFontSize(8.5);
    doc.text(`${fromDate} to ${toDate}`, pageWidth / 2, y, { align: 'center' });
    y += 8;

    // ---- Table ----
    // Balance needs the most room (e.g. "Rs. 7,23,715.00 Dr" is ~20 chars) —
    // the previous widths left it only 18mm, causing text to wrap and
    // overlap between rows. Rebalanced so every column fits its content.
    const cols = [
      { key: 'date', label: 'Date', w: 18, align: 'left' },
      { key: 'particulars', label: 'Particulars', w: 38, align: 'left' },
      { key: 'vchType', label: 'Vch Type', w: 22, align: 'left' },
      { key: 'vchNo', label: 'Vch No.', w: 18, align: 'left' },
      { key: 'debit', label: 'Debit', w: 26, align: 'right' },
      { key: 'credit', label: 'Credit', w: 24, align: 'right' },
      { key: 'balance', label: 'Balance', w: 0, align: 'right' }, // filled in below
    ];
    cols[cols.length - 1].w = contentWidth - cols.slice(0, -1).reduce((s, c) => s + c.w, 0);

    // Column x-position lookup, computed once — used consistently for the
    // header, every row, AND the closing balance row, so they can never
    // drift out of alignment with each other again.
    function colX(key) {
      let x = marginX;
      for (const c of cols) {
        if (c.key === key) return x;
        x += c.w;
      }
      return x;
    }

    let cx = marginX;
    doc.setFontSize(8);
    doc.setFont(undefined, 'bold');
    cols.forEach(c => {
      doc.text(c.label, c.align === 'right' ? cx + c.w - 1 : cx + 1, y, { align: c.align === 'right' ? 'right' : 'left' });
      cx += c.w;
    });
    y += 2;
    doc.line(marginX, y, marginX + contentWidth, y);
    y += 4.5;
    doc.setFont(undefined, 'normal');

    // Opening Balance row — shows where the period actually starts from,
    // so the reader isn't confused why the first transaction's balance
    // isn't just that transaction's own amount.
    doc.setFont(undefined, 'italic');
    doc.text('Opening Balance', colX('particulars') + 1, y);
    doc.text(
      `${formatAmountPlain(Math.abs(openingBalance))} ${openingBalance >= 0 ? 'Dr' : 'Cr'}`,
      colX('balance') + cols.find(c => c.key === 'balance').w - 1, y, { align: 'right' }
    );
    doc.setFont(undefined, 'normal');
    y += 5;

    rows.forEach(r => {
      if (y > 280) {
        doc.addPage();
        y = 15;
      }
      let cx2 = marginX;
      const balLabel = `${formatAmountPlain(Math.abs(r.balance))} ${r.balance >= 0 ? 'Dr' : 'Cr'}`;
      const vals = {
        date: formatTallyDate(r.date),
        particulars: r.particulars || '',
        vchType: r.voucherType || '',
        vchNo: r.voucherNumber || '',
        debit: r.debit ? formatAmountPlain(r.debit) : '',
        credit: r.credit ? formatAmountPlain(r.credit) : '',
        balance: balLabel,
      };
      cols.forEach(c => {
        const text = String(vals[c.key] || '');
        doc.text(text, c.align === 'right' ? cx2 + c.w - 1 : cx2 + 1, y, {
          align: c.align === 'right' ? 'right' : 'left', maxWidth: c.w - 2,
        });
        cx2 += c.w;
      });
      y += 5;
    });

    y += 1;
    doc.line(marginX, y, marginX + contentWidth, y);
    y += 5;

    doc.setFont(undefined, 'bold');
    doc.text(`${closingBalance >= 0 ? 'Dr' : 'Cr'}`, colX('date') + 1, y);
    doc.text('Closing Balance', colX('particulars') + 1, y);
    doc.text(formatAmountPlain(totalDebit), colX('debit') + cols.find(c => c.key === 'debit').w - 1, y, { align: 'right' });
    doc.text(formatAmountPlain(totalCredit), colX('credit') + cols.find(c => c.key === 'credit').w - 1, y, { align: 'right' });
    doc.text(`${formatAmountPlain(Math.abs(closingBalance))} ${closingBalance >= 0 ? 'Dr' : 'Cr'}`, colX('balance') + cols.find(c => c.key === 'balance').w - 1, y, { align: 'right' });
    y += 6;
    doc.line(marginX, y, marginX + contentWidth, y);

    doc.save(`${partyName.replace(/[^a-z0-9]/gi, '_')}_statement.pdf`);
  }

  // ================= VOUCHER DETAIL / INVOICE =================
  let currentVoucherDetail = null;

  function findSalesVoucher(date, voucherNumber) {
    const data = companyData[currentCompany] || {};
    const salesVouchers = data.sales_vouchers || {};
    return Object.values(salesVouchers).find(
      v => v.date === date && String(v.voucher_number) === String(voucherNumber)
    );
  }

  // Tally doesn't always include an aggregate 'Sales' line in a voucher's
  // LEDGERENTRIES.LIST — for some multi-item invoices it only lists the
  // party and tax lines, with the sales value only trackable per-item.
  // We already have every item's amount, so compute the taxable subtotal
  // ourselves rather than depending on Tally to hand us a pre-summed line.
  // Also drops the party's own ledger line, since it's redundant with the
  // "Bill To" name already shown above.
  function buildDisplayTaxLines(items, ledgerLines, partyName) {
    const nonPartyLines = ledgerLines.filter(l => l.ledger_name !== partyName);

    // If Tally already gave us a sales/taxable-looking line, trust it —
    // no need to guess. Otherwise compute one from item amounts.
    const looksLikeTaxLine = (name) => /gst|cess|tax|round\s*off/i.test(name || '');
    const hasSalesLine = nonPartyLines.some(l => !looksLikeTaxLine(l.ledger_name));

    if (hasSalesLine || items.length === 0) {
      return nonPartyLines;
    }

    const taxableAmount = items.reduce((s, i) => s + Math.abs(parseAmt(i.amount)), 0);
    return [{ ledger_name: 'Taxable Value', amount: taxableAmount }, ...nonPartyLines];
  }

      </div>

      <div class="item-table">

        ${items.map(i => `

  // ---- Invoice PDF helpers ----

  function extractGstRate(ledgerName) {
    if (!ledgerName) return null;
    const m = ledgerName.match(/(\d+(\.\d+)?)\s*%/);
    return m ? parseFloat(m[1]) : null;
  }

  function parseQtyUnit(qtyStr) {
    if (!qtyStr) return { qty: '', unit: '' };
    const m = String(qtyStr).trim().match(/^([\d.,\-]+)\s*(.*)$/);
    if (!m) return { qty: qtyStr.trim(), unit: '' };
    return { qty: m[1], unit: m[2] || '' };
  }

  function parseRatePer(rateStr) {
    if (!rateStr) return { rate: '', per: '' };
    const parts = String(rateStr).trim().split('/');
    return { rate: parts[0] || '', per: parts[1] || '' };
  }

  const NUM_ONES = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
    'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const NUM_TENS = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];

  function twoDigitWords(n) {
    if (n < 20) return NUM_ONES[n];
    return NUM_TENS[Math.floor(n / 10)] + (n % 10 ? ' ' + NUM_ONES[n % 10] : '');
  }

  function threeDigitWords(n) {
    let str = '';
    if (n >= 100) {
      str += NUM_ONES[Math.floor(n / 100)] + ' Hundred';
      n = n % 100;
      if (n) str += ' ';
    }
    if (n > 0) str += twoDigitWords(n);
    return str;
  }

  function numberToWordsIndian(num) {
    num = Math.floor(num);
    if (num === 0) return 'Zero';
    let result = '';
    const crore = Math.floor(num / 10000000); num %= 10000000;
    const lakh = Math.floor(num / 100000); num %= 100000;
    const thousand = Math.floor(num / 1000); num %= 1000;
    const hundred = num;
    if (crore) result += threeDigitWords(crore) + ' Crore ';
    if (lakh) result += twoDigitWords(lakh) + ' Lakh ';
    if (thousand) result += twoDigitWords(thousand) + ' Thousand ';
    if (hundred) result += threeDigitWords(hundred);
    return result.trim();
  }

  function amountInWords(amount, unitLabel) {
    const whole = Math.floor(Math.abs(amount));
    const fraction = Math.round((Math.abs(amount) - whole) * 100);
    let words = 'Indian Rupees ' + numberToWordsIndian(whole);
    if (fraction > 0) {
      words += ' and ' + numberToWordsIndian(fraction) + ' Paise';
    }
    words += ' Only';
    return words;
  }

  // Draws a bordered cell with text. align: 'left' | 'center' | 'right'
  function pdfCell(doc, x, y, w, h, text, opts = {}) {
    const { align = 'left', bold = false, fontSize = 8, border = true, padX = 1.5 } = opts;
    if (border) doc.rect(x, y, w, h);
    if (text === undefined || text === null || text === '') return;
    doc.setFontSize(fontSize);
    doc.setFont(undefined, bold ? 'bold' : 'normal');
    let tx = x + padX;
    if (align === 'right') tx = x + w - padX;
    else if (align === 'center') tx = x + w / 2;
    const ty = y + h / 2 + fontSize * 0.13;
    doc.text(String(text), tx, ty, { align, maxWidth: w - padX * 2 });
  }

  // ================= HELPERS =================
  // Firebase drops array entries entirely when every field in them is
  // null/blank, which leaves a genuine 'hole' (undefined) at that index
  // when the array comes back — .filter(Boolean) strips those out so
  // .find()/.map()/etc never trip on an undefined element.
  function safeArray(x) {
    return (x || []).filter(Boolean);
  }

  function parseAmt(v) {
    if (v === null || v === undefined || v === '') return 0;
    const n = parseFloat(v);
    return isNaN(n) ? 0 : n;
  }

  function formatCurrency(n) {
    const abs = Math.abs(n);
    const formatted = abs.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (n < 0 ? '−' : '') + '₹' + formatted;
  }

  // jsPDF's default font (Helvetica) can't render the ₹ symbol — it shows
  // as a broken glyph. Use this instead of formatCurrency() inside any
  // doc.text() call.
  function formatCurrencyPDF(n) {
    const abs = Math.abs(n);
    const formatted = abs.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (n < 0 ? '-' : '') + 'Rs. ' + formatted;
  }

  // No "Rs." prefix — used in the ledger statement table where every row
  // is already a currency figure, so repeating the symbol on every line
  // is just noise (Tally's own statements don't do it either).
  function formatAmountPlain(n) {
    const abs = Math.abs(n);
    return (n < 0 ? '-' : '') + abs.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function formatTallyDate(d) {
    if (!d) return '';
    // Tally dates often come as YYYYMMDD
    if (/^\d{8}$/.test(d)) {
      return `${d.slice(6,8)}-${d.slice(4,6)}-${d.slice(0,4)}`;
    }
    return d;
  }

  function formatDateTime(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    } catch { return iso; }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function getCurrentRows() {
    const data = companyData[currentCompany] || {};
    let key = { outstanding: 'outstanding_receivables', ledgers: 'ledgers', daybook: 'daybook', stock: 'stock_items' }[currentSection];
    let rows = safeArray(data[key]);
    if (searchTerm) {
      rows = rows.filter(r => JSON.stringify(r).toLowerCase().includes(searchTerm));
    }
    return rows;
  }

  // ================= EXPORT =================
  function attachExportButtons() {
    document.getElementById('export-xlsx-btn').addEventListener('click', exportXLSX);
    document.getElementById('export-pdf-btn').addEventListener('click', exportPDF);
  }

  async function exportXLSX() {
    const rows = getCurrentRows();
    if (rows.length === 0) { alert('No data to export.'); return; }
    if (!window.XLSX) {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    }
    const ws = window.XLSX.utils.json_to_sheet(rows);
    const wb = window.XLSX.utils.book_new();
    window.XLSX.utils.book_append_sheet(wb, ws, currentSection);
    window.XLSX.writeFile(wb, `${currentCompany}_${currentSection}.xlsx`);
  }

  async function exportPDF() {
    const rows = getCurrentRows();
    if (rows.length === 0) { alert('No data to export.'); return; }
    if (!window.jspdf) {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const companyLabel = COMPANIES.find(c => c.key === currentCompany)?.label || currentCompany;
    doc.setFontSize(14);
    doc.text(`${companyLabel} — ${currentSection}`, 14, 16);
    doc.setFontSize(9);
    let y = 26;
    const cols = Object.keys(rows[0]);
    doc.text(cols.join(' | '), 14, y);
    y += 6;
    rows.forEach(r => {
      if (y > 280) { doc.addPage(); y = 16; }
      const line = cols.map(c => String(r[c] ?? '')).join(' | ');
      doc.text(line.slice(0, 120), 14, y);
      y += 5.5;
    });
    doc.save(`${currentCompany}_${currentSection}.pdf`);
  }

  function loadScript(src) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }
</script>
</body>
</html>
