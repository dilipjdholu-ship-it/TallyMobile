  <script>
    const ONESIGNAL_APP_ID  = "94b9b25f-e314-4388-a806-6264e8e3dd46";
    const ONESIGNAL_SAFARI  = "web.onesignal.auto.4ddec2dc-5c48-40c7-bde8-da7159bee241";
    // Note: the REST API key is a server-side secret and must never live here.
    // It's only used by netlify/functions/push.js, which now reads it from
    // an environment variable instead of a hardcoded string.

    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: ONESIGNAL_APP_ID,
        safari_web_id: ONESIGNAL_SAFARI,
        serviceWorkerPath: "OneSignalSDKWorker.js",
        notifyButton: { enable: false },
        welcomeNotification: { title: "Shop Manager", message: "Notifications enabled!" },
        promptOptions: {
          slidedown: {
            prompts: [{
              type: "push", autoPrompt: true,
              text: {
                actionMessage: "Get notified when new orders arrive or are ready.",
                acceptButton: "Allow", cancelButton: "Later"
              },
              delay: { pageViews: 1, timeDelay: 5 }
            }]
          }
        }
      });
    });

    // pushNotify calls our Netlify function which proxies to OneSignal server-side
    // This avoids CORS errors that happen when calling OneSignal directly from browser
    window.pushNotify = async function(title, message) {
      try {
        const res = await fetch("https://shivamanage.netlify.app/.netlify/functions/push", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: title, message: message })
        });
        const data = await res.json();
        if (data.errors) {
          window._showPushResult("❌ " + JSON.stringify(data.errors));
        } else {
          window._showPushResult("✅ Sent to " + (data.recipients||0) + " devices");
        }
      } catch(e) {
        window._showPushResult("❌ " + e.message);
      }
    };

    // Show result as a toast on screen
    window._showPushResult = function(msg) {
      console.log("Push result:", msg);
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#0F172A;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;z-index:9999;max-width:90vw;text-align:center;font-family:Inter,sans-serif;word-break:break-all;white-space:normal;box-shadow:0 4px 20px rgba(0,0,0,.4)";
      document.body.appendChild(el);
      setTimeout(function(){ el.remove(); }, 6000);
    };

    // TEST BUTTON — tap in app to test notifications
    window._testPush = function() {
      window.pushNotify("🧪 Test Notification", "Push notifications are working!");
    };
  </script>

  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const MAX = 900;
        let {
          width: w,
          height: h
        } = img;
        if (w > MAX || h > MAX) {
          if (w > h) {
            h = Math.round(h / w * MAX);
            w = MAX;
          } else {
            w = Math.round(w / h * MAX);
            h = MAX;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", 0.72));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function getGPSLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) {
      resolve(null);
      return;
    }
    const timer = setTimeout(() => resolve(null), 8000);
    navigator.geolocation.getCurrentPosition(pos => {
      clearTimeout(timer);
      resolve({
        lat: pos.coords.latitude,
        lng: pos.coords.longitude
      });
    }, () => {
      clearTimeout(timer);
      resolve(null);
    }, {
      timeout: 7000
    });
  });
}

  const [sopRuns, setSopRuns] = useState([]);
  const [sopCats, setSopCats] = useState([]);
  const [tileCats, setTileCats] = useState([]);

  const [attendance, setAttendance] = useState([]);

  useEffect(() => {
    try {
      const saved = localStorage.getItem("shop_session");
      if (saved) {

        if (hoursAgo < 24 && session.user) {
          setCurrentUser(session.user);
          setUser(session.user.displayName);
        } else {
          localStorage.removeItem("shop_session"); // expired

      setShopList(s || []);
      setSharedReqs(sr || []);

      setCustOrders(c || []);
      setCats(ct || INITIAL_CATS);
      setTasks(t || []);
      setPriceItems(pi || []);
      setPriceDocs(pd || []);
      setSopTemplates(st || []);
      setSopRuns(sr || []);
      setSopCats(sc || []);
      setTileCats(tc || []);
      setTileDesigns(td || []);
      setTileMovements(tm || []);
      setAttendance(att || []);
      setLoading(false);
    }
    load();
    const interval = setInterval(async () => {
      const [c, ct, t, sr, td, tm, att] = await Promise.all([sget(sid + "/customer-orders"), sget(sid + "/reorder-cats"), sget(sid + "/tasks-v2"), sget(sid + "/sop-runs"), sget(sid + "/tile-designs"), sget(sid + "/tile-movements"), sget(sid + "/staff-attendance")]);
      if (c) setCustOrders(c);
      if (ct) setCats(ct);
      if (t) setTasks(t);
      if (sr) setSopRuns(sr);
      if (td) setTileDesigns(td);
      if (tm) setTileMovements(tm);
      if (att) setAttendance(att);

    return () => clearInterval(interval);
  }, [user, currentShop]);
  function handleLogin(userObj) {
    // Save session to localStorage — persists for 24 hours
    try {
      localStorage.setItem("shop_session", JSON.stringify({
        user: {
          id: userObj.id,
          displayName: userObj.displayName,
          username: userObj.username,
          role: userObj.role,
          shops: userObj.shops
        },
        loginTime: Date.now()
      }));
    } catch (e) {}
    setCurrentUser(userObj);
    setUser(userObj.displayName);
    setCurrentShop(null);
